function ideaRows(){
  let rs=D.idea.slice();
  if(IF.only==="in")rs=rs.filter(x=>x.split&&x.lf>0);
  if(IF.only==="out")rs=rs.filter(x=>x.ban||(x.split&&x.lf<0));
  /* 묶음 좁히기는 가설 제안 화면이 제 손으로 한다 — 「소구 밖 기전」·「참고」는
     원본 grp에 없는 이름이라 여기서 거르면 한 줄도 안 남는다. */
  if(IF.kind)rs=rs.filter(x=>x.kind===IF.kind);
  if(IF.tag)rs=rs.filter(x=>x.tag===IF.tag);
  if(IF.turn)rs=rs.filter(x=>x.turn===IF.turn);
  if(IF.q){const s=IF.q.trim();rs=rs.filter(x=>(x.v+" "+x.ax).indexOf(s)>=0);}
  rs=rs.filter(x=>x.n>=IF.min);
  const key={rt:x=>-x.rt,lf:x=>-x.lf,lfd:x=>x.lf,n:x=>-x.n,sp:x=>-x.sp,wk:x=>-(x.wsp||0)}[IF.sort];
  rs.sort((a,b)=>key(a)-key(b));
  return rs;
}

/* 가설 제안 — 원고를 쓰는 자리대로 나눠 본다.
   후킹 · 본문 · CTA · 영상 요소. 문장 뱅크와 같은 나눔이라 왔다 갔다 해도
   같은 자리를 본다.

   한 자리 안에서는 판정이 판 순서를 그대로 탄다 —
     소구를 고르고 → 그 소구가 어디서 갈리는지 못박고 → 쓸 워딩과 쓰지 말 워딩.

   「세운 가설」 상자와 「구분(이 값까지·갈래까지·워딩까지)」 칸은 없앴다.
   무슨 말인지 모르겠다는 말을 들었고, 실제로 그 둘은 화면이 해야 할 판정을
   사람에게 떠넘기고 있었다. 지금은 소구를 누르면 「통화품질은 워딩에서
   갈립니다」라고 한 줄로 말한다. 그게 그 둘이 하려던 일이다. */
const IDEA_MUST_N = 5, IDEA_MUST_LF = 0.15;
/* 못박는 기준.
   추천 — 갈렸고, 5편 이상이고, 기저에서 15%p 이상 위로.
   금지 — 5편 이상 썼는데 성공이 한 편도 없거나, 갈렸고 15%p 이상 아래로.
     0/11편을 신뢰구간이 기저를 건넌다는 이유로 「안갈림」에 두면 안 된다. 열한 번
     써서 한 번도 안 된 것은 지금 쓸 이유가 없다 — 못박는 근거는 그 편수 자체다.
   참고 — 판정 문서가 뺀 축. 문서에 없는 값으로 「이걸 해봐라」 하면 안 된다. */
const ideaMark = x => x.ref ? "ref"
  : x.ban ? "no"
  : (x.n>=IDEA_MUST_N && x.w===0) ? "no"
  : (x.split && x.n>=IDEA_MUST_N && x.lf>=IDEA_MUST_LF) ? "yes"
  : (x.split && x.n>=IDEA_MUST_N && x.lf<=-IDEA_MUST_LF) ? "no"
  : (x.lf>=IDEA_MUST_LF) ? "maybe" : "";
const IDEA_MK = {yes:"추천", no:"금지", maybe:"대기", ref:"참고", "":"—"};
const IDEA_RANK = {yes:0, no:1, maybe:2, "":3, ref:4};

/* ── 자리 ────────────────────────────────────────────────────────────────
   원고를 쓰는 순서다. 후킹으로 열고, 본문으로 설득하고, CTA로 닫는다.
   영상 요소는 글이 아니라 누가 말하고 어떻게 찍느냐다. */
let IP = "후킹";
const IPARTS = ["후킹","본문","CTA","영상 요소","참고"];
const IP_NOTE = {
  "후킹":"영상을 무엇으로 여는가. 훅을 고르고, 그 훅을 뭐라고 말할지 고릅니다.",
  "본문":"무엇으로 설득하는가. 소구를 고르고, 그 소구가 어디서 갈리는지 보고 워딩을 고릅니다.",
  "CTA":"무엇으로 닫는가. CTA 갈래를 고르고, 그것을 뭐라고 말할지 고릅니다.",
  "영상 요소":"글이 아니라 누가 말하고 어떻게 찍는가입니다.",
  "참고":"판정 문서가 뺀 축입니다. 「같은 것을 다르게 센 것」이라 추천·금지로 못박지 않습니다."};

/* ptab 줄(문장이 달린 판정)을 축·값 줄과 같은 모양으로 */
const pRow = (r, ax) => ({v:r.v, n:r.n, w:r.w, rt:r.rt, lf:r.lf,
  split:r.out!=="구분 안 됨", ev:r.ev, ax:ax});
const pRows = (part, tab, g) => (D.ptab||[])
  .filter(r=>r.part===part && r.tab===tab && (g===undefined || r.g===g));

/* 자리마다 나무의 뿌리와, 뿌리 아래 층 */
const TREE = {
  "후킹": {root:"훅 유형", why:"무엇으로 열었나",
    tops:()=>pRows("후킹","12유형").map(r=>pRow(r,"훅 12유형")),
    layers:g=>{const rs=pRows("후킹","워딩",g).map(r=>pRow(r,"훅 워딩 · "+g));
      return rs.length?[{lab:"워딩", why:"그 훅을 실제로 뭐라고 말했나", rs:rs}]:[];}},
  "본문": {root:"소구", why:"무엇을 내세웠나",
    tops:()=>D.idea.filter(x=>x.ax==="소구"), layers:g=>soguLayers(g)},
  "CTA": {root:"CTA 갈래", why:"무엇으로 닫았나",
    tops:()=>pRows("CTA","갈래").map(r=>pRow(r,"CTA 갈래")),
    layers:g=>{const rs=pRows("CTA","워딩",g).map(r=>pRow(r,"CTA 워딩 · "+g));
      return rs.length?[{lab:"워딩", why:"그 CTA를 실제로 뭐라고 말했나", rs:rs}]:[];}}
};

/* 본문 — 한 소구 안의 층. 문장이 달린 판정이 먼저, 축·값 코딩이 뒤. */
const SG_TABS = [["문제","무엇을 문제라고 했나","그 소구를 쓴 원고가 무엇을 문제라고 열었나"],
                 ["근거","근거가 무엇인가","그 소구를 무엇으로 뒷받침했나"],
                 ["방식","방식이 무엇인가","그 근거를 어떤 수로 들이밀었나"]];
function soguLayers(g){
  const L=[];
  SG_TABS.forEach(function(t){
    const rs=pRows("본문",t[0],g).map(r=>pRow(r,g+" — "+t[1]));
    if(rs.length) L.push({lab:t[1], why:t[2], rs:rs});
  });
  const mech=D.idea.filter(x=>x.ax===g+" 기전 계열");
  if(mech.length) L.push({lab:"기전", why:"그 근거가 왜 되는지 대는 자리", rs:mech});
  /* 「남들 얘기로 든다(음질)」 — 값 이름에 소구가 괄호로 붙어 있다 */
  const tn=D.idea.filter(x=>x.ax==="통념 — 남들 얘기로 든다" && x.v.indexOf("("+g+")")>=0);
  if(tn.length) L.push({lab:"통념", why:"남들 얘기로 든다", rs:tn});
  const wd=D.idea.filter(x=>x.ax.indexOf(g+" · ")===0);
  if(wd.length) L.push({lab:"워딩 갈래", why:"같은 근거라도 말을 어떻게 골랐나", rs:wd});
  return L;
}

/* 받침이 있으면 「은」, 없으면 「는」. 「배터리은」이라고 쓰면 읽다가 걸린다. */
function josa(w, a, b2){
  const c=w.charCodeAt(w.length-1)-0xAC00;
  return w + ((c>=0 && c<11172 && c%28) ? a : b2);
}
/* 값 이름과 문장이 얼마나 겹치나 — 두 글자씩 끊어 센다.
   축·값 줄은 제 문장이 없어서 같은 원고·같은 자리의 문장 중에서 고른다.
   「원음 97%를 복원한다고 한다」에 「30만 원짜리도 써봤어요」를 붙이면 거짓말이 된다. */
function sgScore(v, ln){
  let hit=0;
  for(let i=0;i<v.length-1;i++){ const g=v.slice(i,i+2);
    if(/[가-힣0-9%]{2}/.test(g) && ln.indexOf(g)>=0) hit++; }
  return hit;
}
function sgLines(g, r, part){
  const out=[];
  if(r.ev){
    Object.entries(r.ev).forEach(function(e){ (e[1]||[]).forEach(ln=>out.push({t:e[0], ln:ln})); });
  }else{
    /* 금지 값은 성공작이 없다 — 실패작 문장을 보인다. 쓰지 말라는 자리다. */
    const ok=new Set((r.wins&&r.wins.length)?r.wins:(r.loses||[]));
    if(ok.size)(D.ptab||[]).forEach(function(p){
      if(p.part!==(part||"본문")||p.g!==g)return;
      Object.entries(p.ev||{}).forEach(function(e){
        if(ok.has(e[0]))(e[1]||[]).forEach(ln=>out.push({t:e[0], ln:ln})); });
    });
  }
  const seen=new Set();
  const uniq=out.filter(function(x){const k=x.t+"｜"+x.ln;
    if(seen.has(k))return false; seen.add(k); return true;});
  if(!r.ev) uniq.forEach(function(x){ x.near=true; x.sc=sgScore(r.v, x.ln); });
  return uniq.sort(function(a,b){
    const A=(DR[a.t]||{}).st==="성공"?0:1, B=(DR[b.t]||{}).st==="성공"?0:1;
    return A-B || (b.sc||0)-(a.sc||0) || ((DR[b.t]||{}).r||0)-((DR[a.t]||{}).r||0);});
}

const sgBar = x => el("span",{class:"ib"},
  el("i",{style:"width:"+Math.max(2,Math.min(100,x.rt*100))+"%;background:"+
    (x.rt>=D.base?"var(--ok)":"var(--no)")}),
  el("u",{style:"left:"+(D.base*100)+"%",title:"기저율 "+pc(D.base)}));
const sgNum = x => el("span",{class:"in2"},el("b",{},pc(x.rt)),
  el("span",{class:"dim"}," "+x.w+"/"+x.n+"편 "), el("span",{class:x.lf>0?"g":"b"},pp(x.lf)));

/* 같은 원고 묶음을 다른 축 이름으로 또 센 줄이 있다.
     통화품질 · 복원 기술      원음 97%를 복원한다고 한다   5/8편
     통화품질 · 숫자를 어떻게 댔나  원음 97%라고 한다        5/8편
   원고 여덟 편이 글자 하나 안 틀리고 같고, 붙은 문장도 같은 문장이다. 팀이 축을
   여러 개로 코딩해서 그렇지 두 가지 일이 아니다. 세 개로 쪼개진 것도 있다 —
   하루 100원꼴이라고 한다 / ③ 하루 100원꼴로 환산 / 하루 100원꼴로 환산한다.

   그래서 원고 묶음을 지문(ds)으로 삼아 화면에서 한 줄로 합친다. 이름은 다 적는다.
   판정 수치는 안 건드린다 — 「어디서 갈리나」는 합치기 전 층으로 잰다. 합치면서
   층이 하나 줄면 벌어짐이 달라져 판정이 바뀌기 때문이다. 보이는 것만 합친다.
   3편 미만은 안 합친다 — 우연히 같은 원고를 쓴 것일 수 있다. */
function dedupe(rs, seen){
  const out=[];
  rs.forEach(function(r){
    const k=(r.n>=3 && r.ds) ? r.ds : null;
    if(k && seen.has(k)){ const p=seen.get(k); p.also.push(r); return; }
    const c=Object.assign({}, r, {also:[]});
    if(k) seen.set(k, c);
    out.push(c);
  });
  return out;
}

/* ── 나무 ────────────────────────────────────────────────────────────── */
let SG_OPEN = "";
const SG_ALL = {};
const SG_MIN = 5;   // 층이 갈리는지 보려면 값마다 이만큼은 있어야 한다

function sgSplit(part, g){
  return TREE[part].layers(g).map(function(L){
    const rs=L.rs.filter(r=>r.n>=SG_MIN).sort((a,b)=>b.rt-a.rt);
    return rs.length<2 ? {L:L, ok:false, thin:rs.length}
      : {L:L, ok:true, rs:rs, hi:rs[0], lo:rs[rs.length-1],
         spread:rs[0].rt-rs[rs.length-1].rt};
  });
}

function soguTree(part){
  const T=TREE[part], wrap=el("div",{class:"sgt"});
  /* 잘되는 것부터 쭉. 편수가 모자란 것은 성공률이 높아도 뒤로 — 1/2편 100%가
     92편 34%보다 위에 서면 안 된다. */
  const tops=T.tops().slice().sort((a,b)=>
    ((b.n>=IDEA_MUST_N)-(a.n>=IDEA_MUST_N)) || (b.lf-a.lf));
  if(!tops.length) return wrap;
  wrap.append(el("p",{class:"sgtop"},el("b",{},T.root),
    el("span",{class:"dim"}," — "+T.why+". 잘되는 것부터입니다. 누르면 안이 열립니다.")));
  tops.forEach(function(x){
    const open=SG_OPEN===x.v, mk=ideaMark(x);
    const picked=PICK.some(p=>p.ax===x.ax&&p.v===x.v);
    const hd=el("div",{class:"sgh"+(open?" on":""),id:"sg_"+x.v});
    hd.append(el("span",{class:"mk "+(mk||"none")},IDEA_MK[mk]),
      el("button",{class:"sgn lnk",onclick:function(){SG_OPEN=open?"":x.v;renderCards();
        if(!open){const e=document.getElementById("sg_"+x.v); if(e)e.scrollIntoView({block:"nearest"});}}},
        (open?"▾ ":"▸ ")+x.v),
      sgBar(x), sgNum(x),
      el("button",{class:"lnk ic",onclick:function(){
        if(picked)PICK=PICK.filter(p=>!(p.ax===x.ax&&p.v===x.v));
        else PICK.push({ax:x.ax,v:x.v,lf:x.lf,ban:x.ban||x.lf<0,rt:x.rt,n:x.n});
        renderCards();}},picked?"담음":"담기"));
    wrap.append(hd);
    if(open) wrap.append(soguBody(part,x.v));
  });
  return wrap;
}

/* 누르면 「어디서 갈리나」를 먼저 못박고, 그 자리의 워딩만 내민다.
   층을 다섯 개 늘어놓으면 읽는 사람이 판정을 대신 해야 한다. */
function soguBody(part, g){
  const b=el("div",{class:"sgb"});
  const seen=new Map();
  const all=sgSplit(part,g), ok=all.filter(x=>x.ok).sort((a,b2)=>b2.spread-a.spread);
  if(!ok.length){
    b.append(el("p",{class:"sgvd"},el("b",{},"아직 갈릴 만큼 안 쌓였습니다."),
      el("span",{class:"dim"}," 값마다 "+SG_MIN+"편은 있어야 어느 자리에서 갈리는지 말할 수 있습니다.")));
    b.append(sgMore(part,g,all,true,seen)); return b;
  }
  const top=ok[0];

  /* ① 판정 한 줄 — 어디서 갈리나 */
  const rest=ok.slice(1,4).map(x=>x.L.lab+" "+pp(x.spread)).join(" · ");
  b.append(el("p",{class:"sgvd"},
    el("span",{class:"mk yes"},"갈린다"),
    el("b",{},josa(g,"은","는")+" 「"+top.L.lab+"」에서 갈립니다"),
    el("span",{class:"dim"}," — 제일 잘된 값과 제일 안된 값이 "+pp(top.spread)+" 벌어집니다"
      +(rest?". 다음은 "+rest:"")+". "+SG_MIN+"편 이상 쓴 값끼리 잰 것입니다.")));

  /* ② 그 자리에서 쓸 것과 쓰지 말 것 */
  const half=function(lab,cls,arr0,why){
    const arr=dedupe(arr0,seen);
    b.append(el("p",{class:"sgl"},el("span",{class:"mk "+cls},lab),
      el("span",{class:"dim"}," "+why+" · "+arr.length+"개")));
    if(!arr.length){ b.append(el("p",{class:"dim sm2",style:"margin:2px 0 0 8px"},
      "여기서 못박을 값이 없습니다.")); return; }
    const k=g+"｜"+lab, big=SG_ALL[k], lim=big?99:4;
    arr.slice(0,lim).forEach(r=>b.append(sgRow(part,g,r)));

    if(arr.length>lim) b.append(el("button",{class:"lnk more",
      onclick:function(){SG_ALL[k]=true;renderCards();}},lab+" "+(arr.length-lim)+"개 더"));
  };
  half("쓸 것","yes",top.rs.filter(r=>ideaMark(r)==="yes"),
    IDEA_MUST_N+"편 이상 · 갈림 · 기저 "+pc(D.base)+"보다 "+(IDEA_MUST_LF*100).toFixed(0)+"%p 위");
  half("쓰지 말 것","no",top.rs.filter(r=>ideaMark(r)==="no"),
    IDEA_MUST_N+"편 이상인데 성공이 없거나, 갈렸고 그만큼 아래");
  const wait=top.rs.filter(r=>ideaMark(r)==="maybe").length;
  if(wait) b.append(el("p",{class:"dim sm2",style:"margin:6px 0 0 8px"},
    wait+"개는 기저보다 위지만 아직 못박을 게 아닙니다 — 아래 「다른 자리도 보기」에 있습니다."));

  b.append(sgMore(part,g,all,false,seen));
  return b;
}

/* 나머지 자리는 접어 둔다 — 판정을 내린 다음에 보는 것이다 */
function sgMore(part, g, all, open0, seen){
  const wrap=el("div",{});
  if(all.length<=1 && open0) return wrap;
  const key=g+"｜더", on=SG_ALL[key]||open0;
  wrap.append(el("button",{class:"lnk more",onclick:function(){SG_ALL[key]=!on;renderCards();}},
    on?"다른 자리 접기":"다른 자리도 보기 — "+all.map(x=>x.L.lab).join(" · ")));
  if(!on) return wrap;
  all.forEach(function(x){
    const L=x.L;
    wrap.append(el("p",{class:"sgl"},el("b",{},L.lab),el("span",{class:"dim"}," — "+L.why),
      el("span",{class:"dim"}, x.ok?" · "+L.rs.length+"개 · 벌어짐 "+pp(x.spread)
        : " · "+L.rs.length+"개 · "+SG_MIN+"편 넘게 쓴 값이 "+x.thin+"개라 갈리는지 못 잽니다")));
    const k2=g+"｜"+L.lab, big=SG_ALL[k2];
    const rs=dedupe(L.rs.slice().sort((a,b2)=>
      (IDEA_RANK[ideaMark(a)]-IDEA_RANK[ideaMark(b2)])||(b2.rt-a.rt)||(b2.n-a.n)), seen);
    rs.slice(0, big?99:4).forEach(r=>wrap.append(sgRow(part,g,r)));
    if(!big && rs.length>4) wrap.append(el("button",{class:"lnk more",
      onclick:function(){SG_ALL[k2]=true;renderCards();}},L.lab+" "+(rs.length-4)+"개 더"));
  });
  return wrap;
}

function sgRow(part, g, r){
  const mk=ideaMark(r), lines=sgLines(g,r,part);
  const row=el("div",{class:"sgr"});
  const picked=r.ax && PICK.some(p=>p.ax===r.ax&&p.v===r.v);
  row.append(el("span",{class:"mk "+(mk||"none")},IDEA_MK[mk]),
    el("span",{class:"sgv",title:r.ax||""},r.v),
    sgBar(r), sgNum(r),
    el("button",{class:"lnk ic",onclick:function(){
      if(picked)PICK=PICK.filter(p=>!(p.ax===r.ax&&p.v===r.v));
      else PICK.push({ax:r.ax||g,v:r.v,lf:r.lf,ban:r.lf<0,rt:r.rt,n:r.n});
      renderCards();}},picked?"담음":"담기"));
  const box=el("div",{class:"sgi"});
  box.append(row);
  if(r.also && r.also.length) box.append(el("p",{class:"sgal"},
    "같은 원고 "+r.n+"편을 이렇게도 셌습니다 — "+
    r.also.map(a=>"「"+a.v+"」("+a.ax+")").join(" · ")));
  /* 워딩 — 판정이 들고 있는 진짜 문장. 감춰 두면 아무도 안 연다. */
  if(lines.length){
    const one=lines[0], ok=(DR[one.t]||{}).st==="성공";
    const cp=el("button",{class:"lnk ic"},"복사");
    cp.addEventListener("click",()=>bkCopy(one.ln,cp));
    box.append(el("div",{class:"sgq"+(ok?"":" bad")},
      one.near?el("span",{class:"sgnr",title:"판정이 이 값에 문장을 달아 두지 않아, 이 값을 쓴 그 원고가 같은 자리에서 쓴 문장 중 제일 가까운 것을 보입니다"},"가까운 문장"):null,
      el("span",{class:"sgqt"},"“"+one.ln+"”"),
      el("button",{class:"lnk "+(ok?"g":"b"),onclick:()=>openDraft(one.t)},one.t),
      cp,
      lines.length>1?el("button",{class:"lnk ic",onclick:function(e){
        const t=e.target.closest(".sgi"), old=t.querySelector(".sgqs");
        if(old){old.remove();e.target.textContent="문장 "+(lines.length-1)+"개 더";return;}
        const w=el("div",{class:"sgqs"});
        lines.slice(1,9).forEach(function(L2){
          const c2=el("button",{class:"lnk ic"},"복사");
          c2.addEventListener("click",()=>bkCopy(L2.ln,c2));
          const ok2=(DR[L2.t]||{}).st==="성공";
          w.append(el("div",{class:"sgq"+(ok2?"":" bad")},el("span",{class:"sgqt"},"“"+L2.ln+"”"),
            el("button",{class:"lnk "+(ok2?"g":"b"),onclick:()=>openDraft(L2.t)},L2.t), c2));
        });
        t.append(w); e.target.textContent="접기";
      }},"문장 "+(lines.length-1)+"개 더"):null));
  }else{
    box.append(el("p",{class:"dim sm2",style:"margin:2px 0 0 6px"},"판정에 이 값의 문장이 없습니다."));
  }
  return box;
}

/* ── 다음에 해볼 것 ───────────────────────────────────────────────────────
   성적표만 있으면 「이런 원고를 쓰고 있구나」에서 끝난다. 「그래서 이걸 해봐야지」가
   되려면 지금 하고 있는 것과의 차이가 보여야 한다. 둘만 본다.

     넣어볼 것    잘되는데 요즘 안 쓰는 값 — 하다가 놓친 것
     지금 어기는 것  라이브 원고가 실제로 쓰고 있는 금지 값 — 돈이 나가는 중

   줄여 쓰지 않고 문장으로 쓴다. 「83% 5/6편 +61%p · 마지막 2026-05-20」은
   숫자를 아는 사람만 읽을 수 있다. 예상 승률 같은 지어낸 숫자는 쓰지 않는다. */
function ideaTodo(){
  const box=el("div",{class:"todo"});
  const mine=x=>partOf(x)===IP;
  const cold=D.idea.filter(x=>!x.ref && mine(x) && x.split && x.n>=IDEA_MUST_N
      && x.lf>=IDEA_MUST_LF && !(x.nL||0))
    .map(function(x){
      const ts=[].concat(x.wins||[], x.loses||[]);
      const last=ts.reduce(function(a,t){const w=(DR[t]||{}).ws; return w&&w>a?w:a;},"");
      return Object.assign({}, x, {last:last});
    }).sort((a,b)=>b.lf-a.lf);
  const live=new Set(D.live.map(x=>x.t)), cod=D.jcod||{};
  const bans=D.idea.filter(x=>!x.ref && mine(x) &&
      ((x.n>=IDEA_MUST_N&&x.w===0)||(x.split&&x.n>=IDEA_MUST_N&&x.lf<=-IDEA_MUST_LF)))
    .map(x=>Object.assign({}, x, {lts:[...live].filter(t=>((cod[t]||{})[x.ax]||[]).includes(x.v))}))
    .filter(x=>x.lts.length)
    .sort((a,b)=>b.lts.length-a.lts.length || a.rt-b.rt);

  /* 여기도 같은 것이 두 번 서면 안 된다 — 「하루 100원꼴이라고 한다」와
     「③ 하루 100원꼴로 환산」이 나란히 서 있었다. */
  const cold2=dedupe(cold,new Map()), bans2=dedupe(bans,new Map());
  const head=(t,n,c)=>el("p",{class:"todoh"},el("span",{class:"mk "+c},n),el("b",{},t));
  if(cold2.length){
    box.append(head("넣어볼 것",cold2.length+"개","yes"),
      el("p",{class:"dim sm2"},"잘되는데 최근 절반에 한 편도 안 쓴 값입니다. 하다가 놓친 것입니다."));
    cold2.slice(0,4).forEach(x=>box.append(el("p",{class:"todor"},
      el("button",{class:"lnk tv",onclick:()=>lyGo(x.ax,x.v)},"「"+x.v+"」"),
      el("span",{},"는 "+x.n+"편 써서 "+x.w+"편이 성공했습니다. "),
      el("span",{class:"dim"},"평균보다 잘된 쪽입니다("+pc(x.rt)+" vs 기저 "+pc(D.base)+"). "),
      el("span",{},x.last?"그런데 마지막으로 쓴 게 "+x.last+"입니다.":"그런데 요즘은 안 씁니다."),
      el("button",{class:"lnk ic",onclick:function(){
        if(!PICK.some(p=>p.ax===x.ax&&p.v===x.v))
          PICK.push({ax:x.ax,v:x.v,rt:x.rt,n:x.n,lf:x.lf,ban:false});
        renderCards();}},"담기"))));
  }
  if(bans2.length){
    box.append(head("지금 어기고 있는 것",bans2.length+"개","no"),
      el("p",{class:"dim sm2"},"라이브 원고가 실제로 쓰고 있는 금지 값입니다. 지금 돈이 나가는 중입니다."));
    bans2.slice(0,4).forEach(x=>box.append(el("p",{class:"todor"},
      el("button",{class:"lnk tv",onclick:()=>lyGo(x.ax,x.v)},"「"+x.v+"」"),
      el("span",{},x.w===0 ? "는 "+x.n+"편 써서 한 편도 안 됐습니다. "
                            : "는 "+x.n+"편 써서 "+x.w+"편만 됐습니다("+pc(x.rt)+"). "),
      el("span",{},"지금 라이브인 "+x.lts.length+"편이 쓰고 있습니다 — "),
      ...x.lts.slice(0,4).map((t,i)=>el("span",{},(i?" · ":""),
        el("button",{class:"lnk b",onclick:()=>openDraft(t)},t))),
      x.lts.length>4?el("span",{class:"dim"}," 외 "+(x.lts.length-4)+"편"):null,
      x.also.length?el("span",{class:"dim"}," (같은 것을 "+x.also.map(a=>"「"+a.v+"」").join(" · ")+"으로도 셌습니다)"):null)));
  }
  if(!cold2.length && !bans2.length)
    box.append(el("p",{class:"dim"},IP+"에는 지금 놓친 것도 어기는 것도 없습니다."));
  return box;
}

/* ── 어느 자리의 값인가 ───────────────────────────────────────────────── */
function partOf(x){
  if(x.ref) return "참고";
  const g=x.grp||"";
  if(g==="훅") return "후킹";
  if(g==="CTA") return "CTA";
  if(g==="페르소나"||g==="영상형식"||g==="운영") return "영상 요소";
  return "본문";
}
/* 나무가 이미 삼킨 줄. 밖에 또 두면 같은 줄이 두 번 나온다. */
let SG_SET=null;
function inTree(x){
  if(!SG_SET) SG_SET=new Set(D.idea.filter(y=>y.ax==="소구").map(y=>y.v));
  if(x.ax==="소구" || x.ax==="통념 — 남들 얘기로 든다") return true;
  const h=x.ax.replace(/ 기전 계열$/,"");
  if(h!==x.ax && SG_SET.has(h)) return true;
  return x.ax.indexOf(" · ")>0 && SG_SET.has(x.ax.split(" · ")[0]);
}
/* 「근거」 축 값 11개가 소구별 「방식」 값과 글자 그대로 같은 집합이다.
   소구를 지우고 원고 전체로 다시 센 판이라, 판정 문서도 그 장을 통째로 뺐다. */
const DUP_AX = new Set(["근거","근거 갈래"]);

function renderCards(){
  const box=$("#ideaCards"); if(!box) return;
  box.innerHTML="";
  const q=(IF.q||"").trim();

  if(TREE[IP] && !q) box.append(soguTree(IP));

  /* 나무 밖 값 — 축·값 코딩으로만 있는 것 */
  let rs;
  if(q) rs=D.idea.filter(x=>(x.v+" "+x.ax).indexOf(q)>=0);
  else {
    rs=D.idea.filter(x=>partOf(x)===IP && !DUP_AX.has(x.ax));
    if(IP==="본문") rs=rs.filter(x=>!inTree(x));
  }
  rs=rs.slice().sort((a,b)=>(IDEA_RANK[ideaMark(a)]-IDEA_RANK[ideaMark(b)])||(b.lf-a.lf));

  const cnt=$("#ideaCount");
  if(cnt) cnt.textContent = q ? "「"+q+"」로 찾은 값 "+rs.length+"개" : "";

  if(!rs.length){
    if(q) box.append(el("p",{class:"dim"},"걸린 값이 없습니다."));
    drawBasket(); return;
  }
  if(!q && TREE[IP]) box.append(el("p",{class:"sgtop",style:"margin-top:20px"},
    el("b",{},"다른 코딩으로 센 것"),
    el("span",{class:"dim"}," — 위 나무에 없는 값입니다. 같은 자리를 다른 방식으로 셌습니다.")));

  const tb=el("div",{class:"irows"});
  tb.append(el("div",{class:"irow ihead"},
    el("span",{},"판정"),el("span",{},"값"),el("span",{},"무엇을 정하는 칸인가"),
    el("span",{title:"막대는 성공률. 세로선이 기저 "+pc(D.base)},"성공률"),
    el("span",{},"성적"),el("span",{},"담기"),el("span",{},"자세히")));
  rs=dedupe(rs, new Map());
  const lim=SG_ALL["flat｜"+IP]?999:20;
  rs.slice(0,lim).forEach(x=>tb.append(ideaRow(x)));
  if(rs.length>lim) tb.append(el("button",{class:"lnk more",
    onclick:function(){SG_ALL["flat｜"+IP]=true;renderCards();}},(rs.length-lim)+"개 더 보기"));
  box.append(tb);
  drawBasket();
}

function ideaRow(x){
  const picked=PICK.some(p=>p.ax===x.ax&&p.v===x.v);
  const mk=ideaMark(x);
  const r=el("div",{class:"irow"+(picked?" on":"")});
  r.append(
    el("span",{class:"mk "+(mk||"none")},IDEA_MK[mk]),
    el("button",{class:"iv lnk",title:x.v,onclick:()=>lyGo(x.ax,x.v)},x.v),
    el("span",{class:"ia dim",title:x.ax},x.ax),
    sgBar(x), sgNum(x),
    el("button",{class:"lnk ic",onclick:function(){
      if(picked)PICK=PICK.filter(p=>!(p.ax===x.ax&&p.v===x.v));
      else PICK.push({ax:x.ax,v:x.v,lf:x.lf,ban:x.ban||x.lf<0,rt:x.rt,n:x.n});
      renderCards();}},picked?"담음":"담기"),
    el("button",{class:"lnk ic",title:"이 값을 쓴 원고를 이 자리에서 편다",onclick:function(){
      const o=r.nextSibling;
      if(o&&o.classList&&o.classList.contains("idet")){o.remove();return;}
      r.after(ideaDetail(x));}},"자세히"));
  if(x.also && x.also.length){
    const w=el("div",{});
    w.append(r, el("p",{class:"sgal",style:"margin-left:62px"},
      "같은 원고 "+x.n+"편을 이렇게도 셌습니다 — "+
      x.also.map(a=>"「"+a.v+"」("+a.ax+")").join(" · ")));
    return w;
  }
  return r;
}

/* 펼치면 그 값을 쓴 원고. 알림창은 쓰지 않는다 — 뜨면 화면이 멈춘다. */
function ideaDetail(x){
  const d=el("div",{class:"idet"});
  const list=function(lab,arr,cls){
    if(!arr||!arr.length)return el("p",{class:"dim sm2"},lab+" 없음");
    const p=el("p",{class:"sm2"},el("span",{class:"dim"},lab+" "));
    arr.slice(0,8).forEach((t,i)=>p.append(i?" · ":"",
      el("button",{class:"lnk "+cls,onclick:()=>openDraft(t)},t)));
    return p;};
  d.append(list("성공작",x.wins,"g"),list("실패작",x.loses,"b"),
    el("div",{class:"bar",style:"margin:6px 0 0"},
      el("button",{class:"btn2",onclick:()=>lyGo(x.ax,x.v)},"이 값만 크게 보기 →"),
      el("button",{class:"btn2",onclick:function(){
        DFT={name:"",items:[],hyp:{ax:x.ax,v:x.v,ban:x.lf<0||x.ban}};go("draft");}},
        (x.lf<0||x.ban)?"빼고 써보기 →":"넣고 써보기 →")));
  return d;
}
function ideaCard(x){
  const picked=PICK.some(p=>p.ax===x.ax&&p.v===x.v);
  const bar=el("div",{class:"pbar"},
    el("i",{style:`width:${Math.max(2,x.rt*100)}%;background:${x.rt>=D.base?"var(--ok)":"var(--no)"}`}),
    el("u",{style:`left:${D.base*100}%`,title:`기저율 ${pc(D.base)}`}));
  const tags=el("div",{class:"tags"});
  if(x.kind)tags.append(el("span",{class:"pill "+(x.kind==="위닝"?"p-ok":x.kind==="트렌드"?"p-wa":"p-dim")},x.kind));
  if(x.turn)tags.append(el("span",{class:"pill "+(x.turn==="올라왔다"?"p-ok":"p-no")},x.turn));
  if(x.ban)tags.append(el("span",{class:"pill p-no"},"금지 가설"));
  tags.append(el("span",{class:"pill p-dim"},x.tag));
  const c=el("div",{class:"icard"+(picked?" on":"")},
    el("p",{class:"iax"},x.grp+" · "+x.ax),
    el("p",{class:"ival"},x.v),
    bar,
    el("p",{class:"inum"},
      el("b",{},pc(x.rt)),el("span",{class:"dim"},` ${x.w}/${x.n}편 · 기저대비 `),
      el("span",{class:x.lf>0?"g":"b"},pp(x.lf)),
      el("span",{class:"dim"},` · ${man(x.sp)}`)),
    (x.nE||x.nL)?el("p",{class:"dim sm"},
      (x.nE?`이전 ${x.wE}/${x.nE}`:"이전에 안 씀")+" → "+(x.nL?`최근 ${x.wL}/${x.nL}`:"최근에 안 씀")
      +(x.wroas!=null?` · 이번 주 ${x.wn||0}편 ROAS ${x.wroas.toFixed(2)}`:"")):null,
    tags,
    el("div",{class:"bar",style:"margin:8px 0 0"},
      el("button",{class:picked?"btn":"btn2",onclick:()=>{
        if(picked)PICK=PICK.filter(p=>!(p.ax===x.ax&&p.v===x.v));
        else PICK.push({ax:x.ax,v:x.v,lf:x.lf,ban:x.ban||x.lf<0,rt:x.rt,n:x.n});
        renderCards();}},picked?"담음":"담기"),
      el("button",{class:"btn2",onclick:()=>{
        DFT={name:"",items:[],hyp:{ax:x.ax,v:x.v,ban:x.lf<0||x.ban}};go("draft");}},
        (x.lf<0||x.ban)?"빼고 써보기":"넣고 써보기"),
      (x.wins&&x.wins.length)?el("button",{class:"btn2",onclick:()=>{
        const o=c.querySelector(".idet"); if(o){o.remove();return;}
        c.append(ideaDetail(x));}},"원고"):null));
  return c;
}

function drawBasket(){
  const b=$("#basket");if(!b)return;b.innerHTML="";
  if(!PICK.length)return;
  b.append(el("b",{},`담은 가설 ${PICK.length}개`));
  PICK.forEach(p=>b.append(el("span",{class:"pill "+(p.ban?"p-no":"p-ok"),
    onclick:()=>{PICK=PICK.filter(z=>z!==p);renderCards();},title:"눌러서 뺍니다"},
    (p.ban?"빼기 ":"넣기 ")+p.v)));
  b.append(el("button",{class:"btn",onclick:()=>{

/* 프로그램 태깅 — P1_규칙태깅.py가 배운 규칙을 브라우저에서 그대로 돌린다.
   파이썬 쪽 grams()·apply()와 같은 방식이라야 결과가 같다. */
function gramsJS(lines){
  const g = new Set();
  const put = (s, pre) => {
    (s.match(/[가-힣]+/g) || []).forEach(w => {
      for (let n = 2; n <= 4; n++)
        for (let i = 0; i + n <= w.length; i++) g.add(pre + w.slice(i, i + n));
    });
    (s.match(/[A-Za-z]{2,}|\d+[가-힣A-Za-z]*/g) || []).forEach(w => g.add(pre + w.toLowerCase()));
  };
  put(lines.join(" "), "");
  put(lines.slice(0, 2).join(" "), "«앞»");
  put(lines.slice(-3).join(" "), "«끝»");
  return g;
}

/* 클로드도 규칙도 「몇 번째 줄인가」는 안 준다 — 값과 근거 문장만 준다.
   그래서 두 글자씩 겹치는 비율로 본문에서 그 줄을 찾아 붙인다. V1_검증도구.py의
   best_line과 같은 셈법이다. 이게 없으면 오른쪽 코딩이 왼쪽 문장에 하나도 안 붙어
   「한 줄 한 줄 코딩이 안 된다」가 된다 — 실제로 그랬다. (2026-08-25) */
function gram2(s){
  const t=String(s||"").replace(/[^0-9A-Za-z가-힣]/g,"").toLowerCase();
  const g=new Set(); for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2)); return g;
}
function bestLine(lines,quote,floor){
  const q=gram2(quote); if(q.size<4) return null;
  let best=null,bs=0;
  lines.forEach(function(ln,i){
    const l=gram2(ln); if(!l.size) return;
    let hit=0; q.forEach(function(x){ if(l.has(x)) hit++; });
    const sc=hit/q.size; if(sc>bs){best=i;bs=sc;}
  });
  return bs>=(floor||0.30)?best:null;
}
/* 걸린 낱말이 실제로 있는 줄. 규칙 태깅은 문장이 아니라 낱말을 준다. */
function lineOfWords(lines,words){
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].toLowerCase();
    for(const w of words) if(w.length>=2 && ln.includes(w.toLowerCase())) return i;
  }
  return null;
}
function tagByRule(lines){
  const R = D.rules || {};
  if (!R.rules) return {items: [], note: "규칙 파일이 없습니다. python P1_규칙태깅.py 를 돌리세요."};
  /* 판정 문서가 뺀 축은 찍지 않는다. 「성공 경로 = A 또는 B」를 붙여 놓고
     판정과 대보라고 하면 안 된다 — 문서에 없는 축이다. */
  const DROP = new Set(D.dropped || []);
  const g = gramsJS(lines), sc = {};
  for (const key in R.rules) {
    const r = R.rules[key];
    if (!R.thr[r.ax] || DROP.has(r.ax)) continue;   // 믿을 만하고, 문서가 안 뺀 축만
    let hit = 0, tot = 0;
    r.kw.forEach(k => { tot += k.d; if (g.has(k.w)) hit += k.d; });
    const s = tot ? hit / tot : 0;
    if (s > 0) (sc[r.ax] = sc[r.ax] || []).push({s: s, v: r.v, kw: r.kw.filter(k => g.has(k.w)).slice(0, 3)});
  }
  const multi = new Set(R.multi || []);
  const out = [];
  const done = new Set();
  for (const ax in sc) {
    done.add(ax);
    const lst = sc[ax].sort((a, b) => b.s - a.s);
    const th = (R.thr[ax] || {}).th || 0.55;
    const take = multi.has(ax) ? lst.filter(x => x.s >= th) : (lst[0] && lst[0].s >= th * 0.7 ? [lst[0]] : []);
    take.forEach(function(x){
      const ws = x.kw.map(k => k.w.replace(/«앞»|«끝»/g, ""));
      const li = lineOfWords(lines, ws);
      out.push({axis: ax, val: x.v, ok: true, src: "프로그램",
        conf: Math.round((R.thr[ax] || {}).p * 100) || null,
        li: (li === null ? undefined : li),
        why: "걸린 말 — " + x.kw.map(k => k.w.replace("«앞»", "앞:").replace("«끝»", "끝:")).join(" · ")});
    });
  }
  // 신호가 없으면 그 축에서 절반을 넘는 값을 찍는다(파이썬 쪽과 같은 규칙)
  for (const ax in (R.major || {})) {
    if (DROP.has(ax)) continue;
    if (done.has(ax) && out.some(x => x.axis === ax)) continue;
    out.push({axis: ax, val: R.major[ax].v, ok: true, src: "프로그램",
      conf: Math.round((R.major[ax].p || 0) * 100),
      why: "신호가 없어 가장 흔한 값으로 찍음"});
  }
  const 본축 = Object.keys(R.thr).length + Object.keys(R.major || {}).length;
  return {items: out, note: `규칙은 축 ${본축}개만 봅니다(전체 ${Object.keys(D.axd).length}개). `
    + `정밀도 ${Math.round(R.p * 100)}% · 재현율 ${Math.round(R.r * 100)}%. `
    + `한 줄 한 줄 코딩하려면 「클로드로」를 누르세요 — 전 축을 보고 근거 문장까지 뽑습니다.`};
}

/* 두 결과를 견준다 */
function mergeTags(a, b){
  const key = x => x.axis + "␟" + x.val;
  const A = new Map(a.map(x => [key(x), x])), Bm = new Map(b.map(x => [key(x), x]));
  const out = [];
  for (const [k, x] of A) out.push(Object.assign({}, x, {both: Bm.has(k), only: Bm.has(k) ? "" : "프로그램만"}));
  for (const [k, x] of Bm) if (!A.has(k)) out.push(Object.assign({}, x, {both: false, only: "클로드만"}));
  return out;
}

                     :`${mine.length}개를 붙였습니다. `)
         +`그중 ${붙은줄}개는 왼쪽 문장에 붙었습니다. 아닌 것은 끄세요.`);
  }catch(e){dsay("실패: "+e.message);}

async function callClaudeTag(key,name,body){

  const p=["너는 퍼포먼스 광고 원고를 정해진 축으로 코딩하는 사람이다.","",
    "규칙","- 「고를 값」이 있는 축은 그 안에서만 고른다. 아니면 그 축은 건너뛴다.",
    "- 「원문을 그대로」인 축은 원고에 실제로 쓰인 표현을 짧게 옮긴다.",
    "- 값마다 근거 문장을 원고에서 그대로 하나 뽑는다.",
    "- 확신이 없으면 비운다. 지어내지 않는다.","",
    "축",lines.join("\n"),"","원고 이름: "+name,"원고",'"""',body,'"""'].join("\n");
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
             "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-opus-5",max_tokens:16000,
      messages:[{role:"user",content:p}],
      output_config:{format:{type:"json_schema",schema:{type:"object",properties:{items:{type:"array",
        items:{type:"object",properties:{axis:{type:"string"},val:{type:"string"},why:{type:"string"}},
        required:["axis","val","why"],additionalProperties:false}}},required:["items"],
        additionalProperties:false}}}})});
  if(!res.ok){let d="";try{const e=await res.json();d=(e.error&&e.error.message)||"";}catch(x){}
    throw new Error("HTTP "+res.status+" "+d);}
  const j=await res.json();
  if(j.stop_reason==="refusal")throw new Error("모델이 거절했습니다.");
  const t=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(t.trim()).items||[];
}

/* ── 원고 검증 — 옛 코딩 검증 도구의 짜임 그대로 ─────────────────────────
   표 한 장에 축·값을 늘어놓으면 「이 코딩이 이 원고의 어디를 보고 붙은 것인가」를

     왼쪽  원고 본문. 코딩의 근거가 된 문장에 표시가 붙는다.
     오른쪽 그 원고에 붙은 코딩 전부. 묶음별로 갈라 놓았다.
            줄마다 맞음 / 아님을 누르고, 값을 바꾸고, 근거 문장을 다시 지정한다.
     아래  그 줄에 코딩을 새로 붙인다. 값은 그 축에 이미 쓰인 값 중에서 고른다.

   그 짜임을 그대로 가져오되 겉은 이 콘솔이다. 데이터도 이 콘솔 것만 쓴다 —
   본문은 위에 쓴 글, 축과 값은 판정의 축 목록(axd), 판정은 전 지표 판정.
   고친 것은 브라우저에 저장되고 「수기판정 내려받기」로 파일이 떨어진다. */
/* 새로 쓰는 원고만 볼 수 있으면 반쪽이다. 자료가 새로 들어와 판정이 다시
   내려지면 이미 집행한 원고의 코딩도 다시 봐야 한다 — 그게 유기적으로 도는
   것이다. 판정이 본문(body)과 근거 문장(evd)을 들고 있으니 189편 아무거나
   골라서 그 자리에서 고칠 수 있다. 고친 것은 수기판정으로 떨어지고
   V2_수기반영.py가 다음 갱신 때 먹는다. */
let VSEL = null;      // 왼쪽에서 고른 문장 번호
const VSHUT = new Set();   // 접어 둔 묶음. 기본은 다 펴 둔다 —
                           // 검증하러 들어온 자리라 접혀 있으면 아무것도 못 본다.

/* 문장이 붙을 수 없는 축들. 「나이대 = 60대」에 근거 문장이 있을 리 없다 —
   영상을 보고 매기는 것이지 원고 문장에서 읽는 게 아니다. 그런 줄에까지
   「근거 없음」을 달면 진짜 빠진 것이 안 보인다. */
const V_NOLINE = new Set(["페르소나","영상형식","구조","포지션","운영"]);

const vLines = () => (DFT.body||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
const vSave  = () => { try{ localStorage.setItem("hyp_draft", JSON.stringify(DFT)); }catch(e){} };

/* 같은 값이 같은 문장을 가리키면 한 줄로 묶는다 — 같은 것을 네 번 확인하게
   하지 않으려고 옛 도구가 하던 일이다. 축 이름만 나란히 적는다. */
function vMerge(items){
  const by={}, out=[];
  items.forEach(function(it,i){
    const k=(it.val||"")+"｜"+(it.li===undefined?"":it.li);
    if(it.val && by[k]!==undefined){ out[by[k]].also.push({i:i, it:it}); return; }
    if(it.val) by[k]=out.length;
    out.push({i:i, it:it, also:[]});
  });
  return out;
}

/* 집행한 원고를 골라 그 코딩을 그대로 불러온다 */
function vOpen(t){
  const 줄 = (D.body||{})[t] || [];
  const 근거 = (D.evd||{})[t] || {};
  const 코딩 = (D.jcod||{})[t] || {};
  /* 코딩 값 이름과 판정 표의 값 이름이 늘 같지는 않다. 훅은 코딩이
     「충격적이거나 놀라운 사실 · 남의 니 얘기를 든다」처럼 유형과 워딩을 붙여
     쓰는데, 판정 표는 둘을 따로 센다. 그대로 찾으면 하나도 안 걸린다.
     붙은 이름이면 잘라서도 찾아본다. */
  function 근거찾기(v){
    if (근거[v]) return 근거[v];
    const 쪽 = v.split(" · ");
    for (let i=쪽.length-1; i>=0; i--) if (근거[쪽[i]]) return 근거[쪽[i]];
    return null;
  }
  const items=[];
  Object.keys(코딩).forEach(function(ax){
    (코딩[ax]||[]).forEach(function(v){
      const ln = (근거찾기(v)||[])[0];
      items.push({axis:ax, val:v, ok:true, src:"판정",
        li: ln ? 줄.indexOf(ln) : undefined, why: ""});
    });
  });
  /* 문장이 본문에서 안 찾아지면(줄이 조금 다르면) 번호를 비운다 */
  items.forEach(function(it){ if(it.li===-1){ it.li=undefined;
    it.why="근거 문장이 본문에서 안 찾아집니다"; } });
  DFT={name:t, body:줄.join(String.fromCharCode(10)), items:items, 집행:true};
  VSEL=null; VSHUT.clear();
  viewDraft();
}

/* 아직 안 태운 원고를 연다 — 노션에서 받아 이 PC에서 코딩해 둔 것.
   사이트에서 노션을 직접 부를 수는 없다(CORS·토큰). 갱신 때 받아 담아 둔다.
   집행한 원고와 다른 점은 성과가 없다는 것뿐이고, 화면은 똑같다. */
function nOpen(t){
  const d = (D.new||{})[t];
  if(!d) return;
  DFT = {name:t, body:(d.lines||[]).join(String.fromCharCode(10)),
         집행:false, 노션:true, want:d.want||"", st:d.st||"", at:d.at||"",
         items:(d.items||[]).map(function(x){
           return {axis:x.axis, val:x.val, ok:true, src:"클로드",
                   li:(x.li===null||x.li===undefined?undefined:x.li),
                   why:x.why||""};
         })};
  VSEL=null; VSHUT.clear();
  viewDraft();
}

function drawTag(){
  const box=$("#dOut"); if(!box) return;
  box.innerHTML="";
  const lines=vLines(), on=DFT.items.filter(x=>x.ok!==false).length;
  box.append(el("h3",{},"코딩 검증"),
    el("p",{class:"lede"},
      "왼쪽이 원고, 오른쪽이 그 원고에 붙은 코딩입니다. 코딩 "+DFT.items.length+
      "줄 중 "+on+"줄을 맞다고 두었습니다. 왼쪽에서 문장을 누르고 오른쪽 줄의 "+
      "「근거로」를 누르면 그 문장이 그 코딩의 근거가 됩니다."));

  /* 어느 문장이 어느 코딩의 근거인가 */
  const byLine={};
  DFT.items.forEach(function(it,i){ if(it.li!==undefined&&it.li!==null)
    (byLine[it.li]=byLine[it.li]||[]).push(i); });

  const wrap=el("div",{class:"vwrap"});

  /* ── 왼쪽 — 원고 본문 ── */
  const L=el("div",{class:"vbody"});
  L.append(el("p",{class:"vhd"},el("b",{},DFT.name||"이름 없는 원고"),
    el("span",{class:"dim"}," · "+lines.length+"문장")));
  if(!lines.length) L.append(el("p",{class:"dim"},"위에 원고를 쓰거나 붙여넣으세요."));
  lines.forEach(function(ln,li){
    const hit=byLine[li]||[];
    const p=el("p",{class:"vln"+(VSEL===li?" on":"")+(hit.length?" has":""),
      onclick:function(){ VSEL=(VSEL===li?null:li); drawTag(); }});
    p.append(el("span",{class:"vno"},String(li+1)), el("span",{class:"vtx"},ln));
    if(hit.length) p.append(el("span",{class:"vmk"},hit.length+"개 코딩의 근거"));
    L.append(p);
  });

  /* ── 오른쪽 — 붙은 코딩, 묶음별 ── */
  const R=el("div",{class:"vcode"});
  const rows=vMerge(DFT.items);
  const gof=x=>((D.axd[x.axis]||{}).grp)||"그 밖";
  const gs={}; rows.forEach(r=>(gs[gof(r.it)]=gs[gof(r.it)]||[]).push(r));
  const order=["훅","소구","근거","기전","CTA","페르소나","영상형식","구조","포지션","운영","그 밖"];
  const keys=[...order.filter(g=>gs[g]), ...Object.keys(gs).filter(g=>order.indexOf(g)<0)];

  R.append(el("p",{class:"vhd"},el("b",{},"붙은 코딩"),
    el("span",{class:"dim"}," · 묶음 "+keys.length+"개"),
    el("button",{class:"lnk ic",onclick:function(){
      if(VSHUT.size) VSHUT.clear(); else keys.forEach(g=>VSHUT.add(g));
      drawTag();}}, VSHUT.size?"모두 펴기":"모두 접기")));
  if(!rows.length) R.append(el("p",{class:"dim"},"아직 코딩이 없습니다. 위에서 태깅하거나 아래에서 한 줄 더하세요."));

  keys.forEach(function(g){
    const rs=gs[g], bad=rs.filter(r=>r.it.ok===false).length;
    const open = !VSHUT.has(g);
    R.append(el("p",{class:"vgh"+(open?" on":""),
      onclick:function(){ if(open)VSHUT.add(g); else VSHUT.delete(g); drawTag(); }},
      el("b",{},(open?"▾ ":"▸ ")+g),
      el("span",{class:"dim"}," "+rs.length+"줄"),
      bad?el("span",{class:"mk no"},"아님 "+bad):null));
    if(!open) return;
    rs.forEach(r=>R.append(vRow(r, lines)));
  });

  /* ── 아래 — 코딩 새로 붙이기 ── */
  const axIn=el("input",{type:"text",list:"axList",placeholder:"축 — 쳐서 좁히세요",style:"flex:1"});
  const vIn=el("input",{type:"text",list:"vNew",placeholder:"값",style:"flex:1"});
  const vList=el("datalist",{id:"vNew"});
  const fill=function(){ vList.innerHTML="";
    const d=D.axd[axIn.value]; (d&&!d.free?d.vals:[]).forEach(v=>vList.append(el("option",{value:v}))); };
  axIn.addEventListener("input",fill);
  const add=el("button",{class:"btn2",onclick:function(){
    if(!axIn.value.trim()) return;
    DFT.items.push({axis:axIn.value.trim(), val:vIn.value.trim(), ok:true, src:"수기",
      li:(VSEL===null?undefined:VSEL),
      why:(VSEL===null?"":"근거 — "+lines[VSEL])});
    vSave(); drawTag(); advise();
  }},"이 코딩 붙이기");
  R.append(el("div",{class:"vadd"},
    el("p",{class:"dim sm2"},VSEL===null
      ? "값은 그 축에 이미 쓰인 값 중에서 고릅니다. 왼쪽에서 문장을 고르고 붙이면 근거까지 함께 들어갑니다."
      : "근거 문장 — "+(lines[VSEL]||"").slice(0,60)),
    el("div",{class:"bar",style:"margin:4px 0 0"},axIn,vIn,vList,add)));

  wrap.append(L,R); box.append(wrap);
  box.append(el("div",{class:"bar"},
    el("button",{class:"btn2",onclick:function(){
      DFT.items.forEach(x=>x.ok=true); vSave(); drawTag(); advise();}},"전부 맞음"),
    el("button",{class:"btn2",onclick:dlDraft},"수기판정 내려받기"),
    el("span",{class:"dim"},"고친 것은 이 브라우저에 저장됩니다.")));
  vSave();
}

function vRow(r, lines){
  const it=r.it, i=r.i;
  const d=D.axd[it.axis];
  const bad=!it.axis?"":(!d?"없는 축":(d&&!d.free&&d.vals.indexOf(it.val)<0?"없던 값":""));
  const row=el("div",{class:"vr"+(it.ok===false?" off":"")});

  const vIn=el("input",{type:"text",list:"vL"+i,value:it.val||"",placeholder:"값"});
  const vList=el("datalist",{id:"vL"+i});
  (d&&!d.free?d.vals:[]).forEach(v=>vList.append(el("option",{value:v})));
  vIn.addEventListener("change",function(){ it.val=vIn.value.trim(); vSave(); drawTag(); advise(); });

  row.append(
    el("span",{class:"vax dim",title:it.axis},it.axis),
    el("span",{},vIn,vList),
    el("span",{class:"vbt"},
      el("button",{class:"mkb"+(it.ok!==false?" on y":""),
        onclick:function(){ it.ok=true; vSave(); drawTag(); advise(); }},"맞음"),
      el("button",{class:"mkb"+(it.ok===false?" on n":""),
        onclick:function(){ it.ok=false; vSave(); drawTag(); advise(); }},"아님")),
    el("button",{class:"lnk ic",title:VSEL===null?"왼쪽에서 문장을 먼저 고르세요":"고른 문장을 이 코딩의 근거로",
      onclick:function(){
        if(VSEL===null){ return; }
        it.li=VSEL; it.why="근거 — "+lines[VSEL]; vSave(); drawTag();
      }},"근거로"),
    el("button",{class:"lnk ic",onclick:function(){
      DFT.items.splice(i,1); vSave(); drawTag(); advise(); }},"빼기"));

  const box=el("div",{class:"vri"});
  box.append(row);
  if(bad) box.append(el("p",{class:"vwhy"},el("span",{class:"mk no"},bad),
    el("span",{class:"dim"}," 판정에 없는 것입니다. 판정과 대볼 수 없습니다.")));
  if(it.li!==undefined && it.li!==null && lines[it.li])
    box.append(el("p",{class:"vwhy"},el("span",{class:"vno"},String(it.li+1)),
      el("span",{class:"dim"},"“"+lines[it.li]+"”")));
  else if(it.why) box.append(el("p",{class:"vwhy dim"},it.why));
  else if(V_NOLINE.has(((D.axd[it.axis]||{}).grp)||"")) ;   // 문장이 붙을 수 없는 축
  else box.append(el("p",{class:"vwhy dim"},
    "근거 문장이 없습니다. 왼쪽에서 문장을 고르고 「근거로」를 누르세요."));
  if(r.also.length) box.append(el("p",{class:"vwhy dim"},
    "같은 값이 같은 문장에 또 붙어 있습니다 — "+r.also.map(a=>a.it.axis).join(" · ")));

  /* 판정이 이 값을 뭐라고 하나 */
  const j=(D.idea||[]).find(x=>x.ax===it.axis&&x.v===it.val);
  if(j){
    const mk=ideaMark(j);
    box.append(el("p",{class:"vwhy"},el("span",{class:"mk "+(mk||"none")},IDEA_MK[mk]),
      el("span",{class:"dim"}," 판정 — "+j.w+"/"+j.n+"편 "+pc(j.rt)+" "),
      el("span",{class:j.lf>0?"g":"b"},pp(j.lf))));
  }
  return box;
}
/* ── 트렌드 — 예전엔 되던 게 아직도 되나 ────────────────────────────
   판정은 평생 성적이라 반년 전에 통하던 것을 오늘도 통한다고 말한다.
   계정 기저가 반토막 난 판에서는 그게 위험하다. 라이브한 달로 소재를 갈라
   「예전」과 「지금」을 따로 재고, 기간 기저 대비가 얼마나 움직였는지로 가른다. */
function viewTrend(){
  const m=$("#main");m.innerHTML="";
  const T=D.trend;
  m.append(el("p",{class:"eyebrow"},"트렌드와 가설"),el("h2",{},"예전엔 되던 게 아직도 되나"));
  if(!T){ m.append(el("p",{class:"lede"},"아직 트렌드를 못 냅니다.")); return; }
  m.append(el("p",{class:"lede"},
    `라이브한 달로 소재를 갈라 잽니다. 이전 ${T.early[0]}~${T.early[T.early.length-1]} `+
    `${T.nE}편(성공률 ${pc(T.baseE)}) → 최근 ${T.late[0]}~${T.late[T.late.length-1]} `+
    `${T.nL}편(성공률 ${pc(T.baseL)}). 양쪽에 ${T.min}편 이상 있는 값만 봅니다.`));
  m.append(el("div",{class:"note wa"},el("b",{},"성공률만 보면 안 됩니다. "),
    `계정 전체가 ${pc(T.baseE)}에서 ${pc(T.baseL)}로 내려앉았습니다. 그래서 성공률이 떨어진 값도 `+
    `계정보다 덜 떨어졌으면 「떠오름」입니다 — 아래 숫자는 <b>그 기간 기저와 견준 차이</b>입니다.`));

  const 칸=(제목, 풀이, 목, 색)=>{
    const c=el("div",{class:"card tight"},el("h3",{class:색},제목+" "+목.length),
      el("p",{class:"dim sm2"},풀이));
    if(!목.length){ c.append(el("p",{class:"dim"},"없습니다.")); return c; }
    const t=el("table",{class:"tb"});
    t.append(el("tr",{},el("th",{},"묶음"),el("th",{},"축"),el("th",{},"값"),
      el("th",{class:"n"},"이전"),el("th",{class:"n"},"최근"),el("th",{class:"n"},"기저 대비 변화")));
    목.forEach(r=>t.append(el("tr",{},
      el("td",{class:"dim"},r.grp),el("td",{},r.ax),el("td",{},el("b",{},r.v)),
      el("td",{class:"n"},`${r.wE}/${r.nE}`),
      el("td",{class:"n"},r.nL?`${r.wL}/${r.nL}`:"안 씀"),
      el("td",{class:"n "+(r.d>0?"g":r.d<0?"b":"")},r.d===null||r.d===undefined?"—":pp(r.d)))));
    c.append(t); return c;
  };
  m.append(칸("떠오름","기저 대비가 10%p 넘게 올랐고 지금도 기저 위입니다. 지금 밀어볼 자리입니다.",T.up,"g"));
  m.append(칸("지고 있음","기저 대비가 10%p 넘게 내렸습니다. 예전 성적만 보고 계속 쓰면 안 되는 자리입니다.",T.down,"b"));
  m.append(칸("꾸준","두 기간 다 기저 위이고 크게 안 흔들렸습니다. 믿고 쓸 자리입니다.",T.keep,"g"));
  m.append(칸("다시 해볼 것",
    `이전에 기저보다 10%p 넘게 잘 됐는데 최근 ${T.win}달 동안 한 편도 안 썼습니다. 왜 안 쓰는지 볼 자리입니다.`,
    T.retry,""));
}

/* ── 원고 제안 — 쓰는 차례대로 ────────────────────────────────────
   기준은 둘뿐이다. ①요즘도 기저 위이고 안 꺾인 것 ②예전에 잘됐는데 최근 창에
   한 편도 안 쓴 것. 평생 성적은 안 본다 — 계정 기저가 반토막인 판에서

window.PK = "후킹"; window.PKS = "메인"; window.PKG = "";
const PK_TABS = {

  "본문": ["소구 — 무엇을 말할까", "그 소구를 어떻게 말할까", "근거 — 무엇으로 받칠까"],
  "CTA": ["CTA — 어떻게 닫을까"],
  "영상 요소": ["영상 형식", "구조"],
};
const PK_NOTE = {
  "후킹":"무엇으로 여는가. 3초를 여기서 잃습니다.",
  "본문":"무엇으로 설득하는가. 소구를 고르고, 그 소구를 무엇으로 받칠지 고릅니다.",
  "CTA":"무엇으로 닫는가.",
  "영상 요소":"글이 아니라 어떻게 찍고 어떻게 짜는가입니다."};
/* 「기저 아래」와 「힘이 빠짐」은 다른 얘기다 — 뒤엣것은 아직 기저 위인데
   우위가 꺾인 것이라, 못 쓸 것이 아니라 지켜볼 것이다. */
const PK_MK = {"요즘 된다":"yes", "다시 해볼 것":"maybe", "힘이 빠짐":"maybe",
               "이 소구에 쓰던 것":"", "요즘 안 씀":"none", "표본 모자람":"none",
               "기저 아래":"none", "기준 아래":"none"};
const PK_RANK = {"요즘 된다":0, "다시 해볼 것":1, "힘이 빠짐":2,
                 "표본 모자람":3, "요즘 안 씀":4, "기저 아래":5};

function viewPick(){
  const m=$("#main");m.innerHTML="";
  const T=D.trend, S=(T&&T.suggest)||[];
  m.append(el("p",{class:"eyebrow"},"트렌드와 가설"),el("h2",{},"원고 제안"));
  if(!S.length){ m.append(el("p",{class:"lede"},"아직 제안을 못 냅니다.")); return; }
  m.append(el("p",{class:"lede"},
    "쓰는 차례대로 — 영상 형식 → 구조 → 후킹 → 소구 → 근거 → CTA. "+
    "이전 "+T.early[0]+"~"+T.early[T.early.length-1]+" "+T.nE+"편("+pc(T.baseE)+") → "+
    "최근 "+T.late[0]+"~"+T.late[T.late.length-1]+" "+T.nL+"편("+pc(T.baseL)+")으로 갈라 잰 것입니다."));
  m.append(el("div",{class:"note wa"},el("b",{},"평생 성적은 안 봅니다. "),
    "계정 성공률이 "+pc(T.baseE)+"에서 "+pc(T.baseL)+"로 내려앉았습니다. "+
    "「요즘 된다」는 최근에도 기저 위이면서 안 꺾인 것, "+
    "「다시 해볼 것」은 예전에 기저보다 10%p 넘게 잘됐는데 최근 "+T.win+"달 동안 한 편도 안 쓴 것, "+
    "「힘이 빠짐」은 아직 기저 위인데 우위가 5%p 넘게 꺾인 것입니다."));

  /* 성공률 막대 — 세로선이 그 기간의 기저 */
  const pkBar=(r)=>{const 씀=r.nL>0, rt=씀?(r.wL/r.nL):(r.nE?r.wE/r.nE:0),
    b=씀?T.baseL:T.baseE;
    return el("span",{class:"ib",title:(씀?"최근 ":"이전 ")+pc(rt)+" · 기저 "+pc(b)},
      el("i",{style:"width:"+Math.max(2,Math.min(100,rt*100))+"%;background:"+
        (rt>=b?"var(--ok)":"var(--no)")+(씀?"":";opacity:.45")}),
      el("u",{style:"left:"+(b*100)+"%"}));};
  const pkNum=(r)=>el("span",{class:"in2"},
    el("span",{class:"dim"},r.wE+"/"+r.nE+" → "),
    r.nL?el("b",{},r.wL+"/"+r.nL):el("span",{class:"dim"},"안 씀"));
  const pkDel=(r)=>(r.d===null||r.d===undefined||(!r.wE&&!r.wL))
    ?el("span",{class:"in2 dim"},"—")
    :el("span",{class:"in2 "+(r.d>0?"g":"b")},pp(r.d));

  /* 판정을 누르면 — 누적·이번주·최근4주·최근12주와 그림. 소구 화면이 하던 것을
     그 자리에서 편다. 원고 제안에서 「그래서 지금 돈이 가고 있나」를 못 보면
     반년 전 성적으로 오늘 쓸 것을 고르게 된다. (2026-08-27) */
  const pkStat=(r)=>{
    const box=el("div",{class:"pdet wide"});
    const ts=(r.ts||[]).filter(t=>DR[t]);
    if(!ts.length){ box.append(el("p",{class:"dim"},"이 값을 쓴 원고 목록이 없습니다.")); return box; }
    const n=ts.length, w=ts.filter(t=>DR[t].st==="성공").length, rt=w/n, lf=rt-D.base;
    const r1=dpRecent(ts,1), r4=dpRecent(ts,4), r12=dpRecent(ts,12);
    const 칸=(이름,값,클,밑)=>el("div",{},el("p",{class:"dpk"},이름),
      el("p",{class:"dpv "+클},값), el("p",{class:"dim sm2"},밑));
    const 로아=(x)=>!x?"—":x.roas.toFixed(2);
    const 로클=(x)=>!x?"dim":x.sp<DP_FLOOR?"dim":(x.roas>=D.cut?"g":"b");
    box.append(el("div",{class:"dpsum"},
      칸("누적 성공률", pc(rt), lf>=0?"g":"b", `${w}/${n}편 · 기저 ${pc(D.base)}보다 ${pp(lf)}`),
      칸("이번 주", 로아(r1), 로클(r1),
        r1?`${man(r1.sp)} · ${r1.d}편`+(r1.sp<DP_FLOOR?" · 돈이 적어 숫자가 튑니다":"")
          :"돈이 안 갔습니다"),
      칸("최근 4주", 로아(r4), 로클(r4),
        r4?`${man(r4.sp)} · ${r4.d}편`+(r4.sp<DP_FLOOR?" · 돈이 적어 숫자가 튑니다":""):"—"),
      칸("최근 12주", 로아(r12), 로클(r12),
        r12?`${man(r12.sp)} · ${r12.d}편`+(r12.sp<DP_FLOOR?" · 돈이 적어 숫자가 튑니다":""):"—")));
    box.append(el("p",{class:"dim sm2"},
      "성공률은 판정이 닫힌 원고, ROAS는 그 기간에 돈이 간 원고입니다. 편수가 다를 수 있습니다. "+
      `흐린 숫자는 지출이 ${man(DP_FLOOR)}이 안 돼 크게 튈 수 있다는 뜻입니다 — 지워 두지 않고 그대로 냅니다.`));
    const 표=el("div",{class:"irows"});
    표.append(el("div",{class:"irow prow ihead"},
      el("span",{},""),el("span",{},"기간"),el("span",{},"성적"),
      el("span",{},"성공률"),el("span",{},"기저"),el("span",{},"우위"),el("span",{},""),el("span",{},"")));
    const 기간=(이름,ww,nn,bb)=>{
      if(!nn) return;
      const rr=ww/nn;
      표.append(el("div",{class:"irow prow"},
        el("span",{}),el("span",{class:"iv"},이름),
        el("span",{class:"in2"},`${ww}/${nn}편`),
        el("span",{class:"in2"},el("b",{},pc(rr))),
        el("span",{class:"in2 dim"},pc(bb)),
        el("span",{class:"in2 "+(rr>=bb?"g":"b")},pp(rr-bb)),
        el("span",{}),el("span",{})));
    };
    기간("평생", w, n, D.base);
    기간("이전 "+T.early[0]+"~"+T.early[T.early.length-1], r.wE, r.nE, T.baseE);
    기간("최근 "+T.late[0]+"~"+T.late[T.late.length-1], r.wL, r.nL, T.baseL);
    box.append(표);
    const pts=dpSeries(ts,"주");
    if(pts.length) box.append(multiChart([{name:r.v, color:"#4f7fff", pts}], "roas"));
    else box.append(el("p",{class:"dim sm2"},"최근에 이 값으로 돈이 간 소재가 없습니다."));
    return box;
  };

  /* 값을 누르면 — 그 값을 실제로 쓴 문장이 먼저, 그다음 그 안에서 무엇이 되고 있나 */
  const pkDet=(r)=>{
    const d=el("div",{class:"pdet"});
    (r.원문||[]).forEach(o=>d.append(el("p",{},
      el("span",{},"「"+o.t+"」 "),
      el("button",{class:"lnk "+(o.성?"g":"dim"),onclick:()=>openDraft(o.소재)},o.소재))));
    if((r.작||[]).length) d.append(el("p",{class:"dim"},"쓴 성공작 ",
      ...(r.작).flatMap((w,i)=>[i?el("span",{}," · "):null,
        el("button",{class:"lnk g",onclick:()=>openDraft(w.t)},w.nm)])));
    if(!d.childNodes.length) d.append(el("p",{class:"dim"},"이 값에 딸린 문장이 없습니다."));
    const brs=(r.axr?h3Branches(r.axr,r.v):null)||[];
    if(brs.length){
      d.append(el("p",{class:"bdsg",style:"margin-top:10px"},
        el("b",{},"그 안에서 무엇이 되고 있나"),
        el("span",{class:"dim"},` — 갈래 ${brs.reduce((a,b)=>a+b.vs.length,0)}개`)));
      brs.forEach(b=>{
        d.append(el("p",{class:"dim sm2",style:"margin:6px 0 2px"},b.name));
        const tb=el("div",{class:"irows"});
        tb.append(el("div",{class:"irow prow ihead"},
          el("span",{},"판정"),el("span",{},""),el("span",{},"어떻게 썼나"),
          el("span",{},""),el("span",{},"누적 성공률"),el("span",{},"기저 대비"),
          el("span",{},"최근 4주"),el("span",{},"")));
        b.vs.slice().sort((x,y)=>y.rt-x.rt).slice(0,8).forEach(x=>{
          const mk=wrMark({...x, ban:false}), rr=dpRecent(x.ts,4);
          tb.append(el("div",{class:"irow prow"},
            el("span",{class:"mk "+mk.c},mk.t),el("span",{}),
            el("span",{class:"iv",title:x.v},x.disp||x.v),el("span",{}),
            el("span",{class:"in2"},el("b",{},pc(x.rt)),el("span",{class:"dim"},` ${x.w}/${x.n}편`)),
            el("span",{class:"in2 "+(x.lf>=0?"g":"b")},pp(x.lf)),
            el("span",{class:"in2",title:rr?`지출 ${man(rr.sp)}`+(rr.sp<DP_FLOOR?" — 적어서 숫자가 튑니다":""):""},
              !rr?el("span",{class:"dim"},"—")
              :rr.sp<DP_FLOOR?el("span",{class:"dim"},rr.roas.toFixed(2))
              :el("b",{class:rr.roas>=D.cut?"g":"b"},rr.roas.toFixed(2))),
            el("span",{})));
        });
        d.append(tb);
      });
    } else {
      /* 판정 문서가 안 가른 축이다. 그 값을 쓴 원고들이 함께 쓴 것으로 대신한다. */
      const ts=(r.ts||[]).filter(t=>DR[t]&&COD[t]);
      if(ts.length>=4){
        const 볼축=["소구","훅 유형","CTA 갈래","제작 방식","말투(톤)","화자 깊이"]
          .filter(a=>a!==r.axr);
        const 셈={};
        ts.forEach(t=>{
          볼축.forEach(a=>((COD[t]||{})[a]||[]).forEach(v=>{
            const k=a+"｜"+v; (셈[k]=셈[k]||{a,v,n:0,w:0}).n++;
            if(DR[t].st==="성공") 셈[k].w++;
          }));
        });
        const 함께=Object.values(셈).filter(x=>x.n>=3)
          .map(x=>({...x, rt:x.w/x.n})).sort((a,b)=>b.rt-a.rt||b.n-a.n).slice(0,8);
        if(함께.length){
          d.append(el("p",{class:"bdsg",style:"margin-top:10px"},
            el("b",{},"그 안에서 무엇이 되고 있나"),
            el("span",{class:"dim"},` — 「${r.v}」를 쓴 ${ts.length}편이 함께 쓴 것`)));
          const tb=el("div",{class:"irows"});
          tb.append(el("div",{class:"irow prow ihead"},
            el("span",{},""),el("span",{},""),el("span",{},"함께 쓴 값"),
            el("span",{},"어느 축"),el("span",{},"그중 성공률"),el("span",{},"기저 대비"),
            el("span",{},""),el("span",{},"")));
          함께.forEach(x=>tb.append(el("div",{class:"irow prow"},
            el("span",{}),el("span",{}),
            el("span",{class:"iv",title:x.v},x.v),
            el("span",{class:"ia dim"},x.a),
            el("span",{class:"in2"},el("b",{},pc(x.rt)),el("span",{class:"dim"},` ${x.w}/${x.n}편`)),
            el("span",{class:"in2 "+(x.rt>=D.base?"g":"b")},pp(x.rt-D.base)),
            el("span",{}),el("span",{}))));
          d.append(tb);
          d.append(el("p",{class:"dim sm2"},
            "이 값을 쓴 원고들 안에서만 센 성공률입니다. 3편 이상 겹친 것만 냅니다 — "+
            "겹쳐 쓴 것이라 어느 쪽 덕인지는 이 표로 못 가릅니다."));
        }
      } else if(r.axr){
        d.append(el("p",{class:"dim sm2",style:"margin-top:8px"},
          "이 값 아래로 갈라 볼 것이 판정에 없고, 함께 쓴 것을 셀 만큼 원고도 없습니다."));
      }
    }
    return d;};

  /* 판정이 여럿이라 「그래서 쓰라는 거냐」가 한눈에 안 온다.
     표본이 모자란데 예전에도 기저 밑이었으면 굳이 권할 일이 아니다. (2026-08-27) */
  const pkRec=(r)=>{
    const 어디=r.어디||"", rE=r.nE?r.wE/r.nE:null, bE=T.baseE;
    const 예전됨 = (rE!==null && bE!==null && rE>=bE);
    if(어디==="요즘 된다") return ["쓰세요","yes"];
    if(어디==="다시 해볼 것") return ["해보세요","maybe"];
    if(어디==="힘이 빠짐") return ["지켜보세요","maybe"];
    if(어디==="기저 아래") return ["빼세요","no"];
    if(어디==="표본 모자람"||어디==="요즘 안 씀")
      return 예전됨?["시험해 볼 것","maybe"]:["굳이","none"];
    return ["참고만","none"];
  };
  const pkHead=(값,칸)=>el("div",{class:"irow prow ihead"},
    el("span",{title:"그래서 이걸 쓰라는 건가"},"추천"),
    el("span",{},"판정"),el("span",{},값||"값"),
    el("span",{},칸===undefined?"무엇을 정하는 칸인가":칸),
    el("span",{title:"막대는 성공률. 세로선이 그 기간의 기저"},"성공률"),
    el("span",{},"이전 → 최근"),el("span",{title:"기저 대비 우위가 얼마나 움직였나"},"움직임"),
    el("span",{},"원문"));

  const pkRow=(r,고름)=>{
    const 어디=r.어디||"기준 아래";
    const row=el("div",{class:"irow prow"+(고름?" pk":"")+(고름&&고름.on?" on":"")});
    const 값칸0 = 고름
      ? (()=>el("button",{class:"iv lnk",title:r.v,onclick:고름.go},r.v))
      : (폄=>el("button",{class:"iv lnk",title:r.v+" — 눌러서 쓴 문장과 그 안의 갈래 보기",
                          onclick:()=>폄({kind:"det",make:pkDet})},r.v));
    const 권=pkRec(r);
    const 폄=(만들기)=>{
      const o=row.nextSibling;
      const 열림=o&&o.classList&&o.classList.contains("pdet");
      const 같=열림&&o.dataset.kind===만들기.kind;
      if(열림) o.remove();
      if(같) return;
      const d=만들기.make(r); d.dataset.kind=만들기.kind; row.after(d);
    };
    const 값칸 = 값칸0(폄);
    row.append(
      el("span",{class:"mk "+권[1],title:"판정 「"+어디+"」 · 이전 "+r.wE+"/"+r.nE},권[0]),
      el("button",{class:"mk "+(PK_MK[어디]||"none"),
        title:어디+" — 눌러서 누적·이번 주·최근 성적 보기",
        onclick:()=>폄({kind:"stat",make:pkStat})},어디),
      값칸,
      el("span",{class:"ia dim",title:r.ax||""},r.ax||""),
      pkBar(r), pkNum(r), pkDel(r),
      el("button",{class:"lnk ic",onclick:()=>폄({kind:"det",make:pkDet})},"원문"));
    return row;};

  const pkTable=(rs,값,칸,고름)=>{
    const tb=el("div",{class:"irows"});
    tb.append(pkHead(값,칸));
    rs.forEach(r=>tb.append(pkRow(r,고름&&고름(r))));
    return tb;};

  const seg=el("div",{class:"cseg"});
  Object.keys(PK_TABS).forEach(k=>seg.append(el("button",{class:"csb"+(window.PK===k?" on":""),
    onclick:()=>{window.PK=k;viewPick();}},k)));
  m.append(el("div",{class:"bar"},seg));
  m.append(el("p",{class:"lede"},PK_NOTE[window.PK]));

  // 본문은 「메인으로 세울 소구」와 「한 줄 곁들일 소구」가 아예 다른 물건이다.
  if(window.PK==="본문"){
    const 소구칸=S.filter(x=>x.소구별)[0];
    const 모두=(소구칸&&소구칸.모두)||[];
    if(모두.length){
      const 쪽키=window.PKS==="서브"?"서브":"메인";
      const 순=r=>{const z=r[쪽키];
        return [PK_RANK[z.어디]===undefined?9:PK_RANK[z.어디],
                -(z.어디==="요즘 된다"?(z.d||0):z.nL?(z.wL/z.nL):(z.wE/(z.nE||1)))];};
      const 목록=모두.slice().sort((a,b)=>{const A=순(a),B=순(b);return A[0]-B[0]||A[1]-B[1];});
      if(!목록.some(r=>r.v===window.PKG)) window.PKG=목록[0].v;

      const seg2=el("div",{class:"cseg"});
      [["메인","그 소구를 두 줄 이상 쓴 원고"],["서브","그 소구를 한 줄만 쓴 원고"]].forEach(function(kv){
        seg2.append(el("button",{class:"csb"+(쪽키===kv[0]?" on":""),
          title:kv[1],onclick:()=>{window.PKS=kv[0];viewPick();}},kv[0]+" 소구"));});
      m.append(el("div",{class:"bar"},seg2));
      m.append(el("p",{class:"lede"},쪽키==="메인"
        ?"그 소구를 두 줄 이상 쓴 원고에서만 잰 성적입니다. 이 원고의 기둥으로 세울 소구를 고르는 자리입니다."
        :"그 소구를 한 줄만 쓴 원고에서만 잰 성적입니다. 기둥 말고 곁들일 소구를 고르는 자리입니다."));

      const 줄들=목록.map(r=>Object.assign({},r,r[쪽키],{ax:쪽키+"으로 썼을 때"}));
      const c1=el("div",{class:"card tight"},
        el("h3",{},"소구 — 무엇을 "+(쪽키==="메인"?"기둥으로 세울까":"곁들일까")),
        el("p",{class:"note"},"눌러 고르면 아래가 그 소구의 근거·워딩으로 바뀝니다."));
      c1.append(pkTable(줄들,"소구","어느 쪽으로 썼나",
        r=>({on:r.v===window.PKG, go:()=>{window.PKG=r.v;viewPick();}})));
      m.append(c1);

      const 고른=목록.filter(r=>r.v===window.PKG)[0];
      const c2=el("div",{class:"card tight"},el("h3",{},고른.v+" — 무엇으로 받칠까"));

/* ─── 소재 서랍 ────────────────────────────────────────────────────────────
   어느 화면에서든 소재 이름을 누르면 옆에서 열린다. 미리보기 · 본문 · 판정값 ·
   그 소재에 걸린 금지가 한 자리에 있다. 화면을 갈아타면 보던 자리를 잃는다. */
function openDraft(name){
  const d=DR[name]; if(!d) return;
  let dr=$("#drawer");
  if(!dr){
    dr=el("div",{id:"drawer",class:"drawer"});
    const back=el("div",{id:"drawerbg",class:"drawerbg",onclick:closeDraft});
    document.body.append(back,dr);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeDraft(); });
  }
  dr.innerHTML="";
  dr.append(el("div",{class:"bar drtop"},
    el("b",{},name),
    el("button",{class:"lnk",onclick:()=>{go("drafts");closeDraft();}},"소재 화면에서 보기"),
    el("button",{class:"btn2",onclick:closeDraft},"닫기 ✕")));
  const body=el("div",{class:"drbody"});
  showDraft(d, body);
  dr.append(body);
  dr.classList.add("on"); $("#drawerbg").classList.add("on");
}
function closeDraft(){
  const dr=$("#drawer"), bg=$("#drawerbg");
  if(dr)dr.classList.remove("on"); if(bg)bg.classList.remove("on");
}

function advise(){

  const box=$("#dAdv");box.innerHTML="";

  const has=new Set(DFT.items.filter(x=>x.ok&&x.axis&&x.val).map(x=>x.axis+SEPJ+x.val));

  const bad=D.advice.out.filter(x=>has.has(x.ax+SEPJ+x.v));

  const good=D.advice.in.filter(x=>has.has(x.ax+SEPJ+x.v));

  const miss=D.advice.in.filter(x=>!has.has(x.ax+SEPJ+x.v)).slice(0,5);

  const card=(title,cls,list,render,empty)=>{

    const c=el("div",{class:"card tight"},el("h3",{class:cls},title+" "+list.length));

    if(!list.length){c.append(el("p",{class:"dim"},empty));return c;}

    list.forEach(x=>c.append(render(x)));return c;};

  const line=x=>{

    const der=(D.derived||{})[x.ax];

    const ex=x.words&&x.words.length

      ? el("p",{class:"dim sm"},"이렇게 씁니다 — "+

          x.words.slice(0,2).map(w=>"「"+w.v+"」("+w.t+")").join(" · "))

      : (x.wins&&x.wins.length

          ? el("p",{class:"dim sm"},"이 값을 쓴 성공작 — "+x.wins.slice(0,3).join(" · ")

              +(der?" · 본문에 안 나오는 값입니다(제작 지시)":""))

          : null);

    return el("div",{class:"advrow"},

      el("p",{class:"lrow"},el("b",{},x.v),el("span",{class:"dim"}," "+x.ax),

        el("span",{class:"n"}," "+x.w+"/"+x.n+"편 "+pc(x.rt)),

        el("span",{class:x.lf>0?"g":"b"}," "+pp(x.lf))),

      ex);

  };

  box.append(el("h3",{},"이 원고에 대해"));

  /* ── 트렌드 딱지 — 판정은 평생 성적이라 「반년 전에 되던 것」을 오늘도 된다고 말한다.
     이 원고가 쓴 값 중 최근에 지고 있는 것을 먼저 짚는다. (2026-08-26) */
  (function(){
    const T=D.trend; if(!T) return;
    const 표={};
    (T.down||[]).forEach(x=>표[x.ax+SEPJ+x.v]={칸:"지고 있음", d:x.d, r:x});
    (T.up||[]).forEach(x=>표[x.ax+SEPJ+x.v]={칸:"떠오름", d:x.d, r:x});
    (T.keep||[]).forEach(x=>표[x.ax+SEPJ+x.v]={칸:"꾸준", d:x.d, r:x});
    const 걸린=[...has].map(k=>({k:k, t:표[k]})).filter(x=>x.t);
    const 짐=걸린.filter(x=>x.t.칸==="지고 있음");
    const 좋=걸린.filter(x=>x.t.칸!=="지고 있음");
    if(!걸린.length) return;
    const c=el("div",{class:"card tight"},el("h3",{},"최근 흐름"),
      el("p",{class:"dim sm2"},
        `이전 ${T.nE}편(${pc(T.baseE)}) → 최근 ${T.nL}편(${pc(T.baseL)})으로 갈라 잰 것입니다. `+
        `아래는 그 기간 기저와 견준 차이입니다.`));
    if(짐.length){
      c.append(el("p",{class:"lrow"},el("b",{class:"b"},"지고 있는 것 "+짐.length)));
      짐.forEach(x=>c.append(el("p",{class:"advrow"},
        el("p",{class:"lrow"},el("b",{},x.t.r.v),el("span",{class:"dim"}," "+x.t.r.ax),
          el("span",{class:"n"},` 이전 ${x.t.r.wE}/${x.t.r.nE} → 최근 ${x.t.r.wL}/${x.t.r.nL}`),
          el("span",{class:"b"}," "+pp(x.t.d))))));
      c.append(el("p",{class:"dim sm2"},
        "예전 성적으로 고른 것이면 다시 봐야 합니다. 판정 표는 평생 성적이라 이 흐름을 안 보여줍니다."));
    }
    if(좋.length) c.append(el("p",{class:"dim sm2"},
      "최근에도 버티는 것 — "+좋.map(x=>`「${x.t.r.v}」(${x.t.칸})`).join(" · ")));
    box.append(c);
  })();

  /* ── 소구 추천 · 그 소구의 근거 추천 ────────────────────────────
     「빼세요/좋습니다」는 이미 쓴 값에 대한 말이다. 안 쓴 것 중에 무엇을 더 할지는
     소구 → 근거 순서로 말해야 원고를 고칠 수 있다. 판정이 낸 소구 표를 그대로 쓴다. */
  (function(){
    const S=D.sogu||[]; if(!S.length) return;
    const 쓴소구=new Set(DFT.items.filter(x=>x.ok&&/소구/.test(x.axis||"")).map(x=>x.val));
    const 쓴값=new Set(DFT.items.filter(x=>x.ok).map(x=>x.val));
    const c=el("div",{class:"card tight"},el("h3",{},"무엇을 더 할까"));
    /* ① 이 원고가 든 소구에 딸린 근거 중, 아직 안 쓴 것 */
    const 근거줄=[];
    S.filter(d=>쓴소구.has(d.s)).forEach(d=>{
      (d.proofs||[]).filter(p=>p.out==="올린다"&&p.n>=3&&!쓴값.has(p.name))
        .sort((a2,b2)=>b2.rate-a2.rate).slice(0,3)
        .forEach(p=>근거줄.push({s:d.s,p:p}));
    });
    if(근거줄.length){
      c.append(el("p",{class:"lrow"},el("b",{},"이 원고의 소구를 받칠 근거")));
      근거줄.forEach(x=>c.append(el("p",{class:"advrow"},
        el("p",{class:"lrow"},el("span",{class:"pill p-ok"},x.s),
          el("b",{}," "+x.p.name),
          el("span",{class:"n"},` ${x.p.n}편 ${pc(x.p.rate)}`),
          el("span",{class:"dim"}," "+x.p.out)))));
    }
    /* ② 안 든 소구 중 성적이 좋은 것 */
    const 소구줄=S.filter(d=>!쓴소구.has(d.s)&&d.out==="올린다"&&d.n>=5)
      .sort((a2,b2)=>b2.rate-a2.rate).slice(0,4);
    if(소구줄.length){
      c.append(el("p",{class:"lrow",style:"margin-top:8px"},el("b",{},"이 원고에 없는 소구")));
      소구줄.forEach(d=>{
        const 좋=(d.proofs||[]).filter(p=>p.out==="올린다"&&p.n>=3)
          .sort((a2,b2)=>b2.rate-a2.rate).slice(0,2).map(p=>p.name);
        c.append(el("p",{class:"advrow"},
          el("p",{class:"lrow"},el("b",{},d.s),
            el("span",{class:"n"},` ${d.n}편 ${pc(d.rate)}`),
            좋.length?el("span",{class:"dim"}," · 받칠 근거 — "+좋.join(" · ")):null)));
      });
    }
    if(근거줄.length||소구줄.length){
      c.append(el("p",{class:"dim sm2"},
        "소구는 판정된 원고에서 센 것이고, 근거는 그 소구를 든 원고 안에서만 센 것입니다. "+
        "「올린다」로 찍힌 것만 내놓습니다."));
      box.append(c);
    }
  })();

  const two=el("div",{class:"two"});

  two.append(card("빼세요","b",bad,line,"뺄 것이 없습니다."),

             card("좋습니다","g",good,line,"갈린 값이 아직 안 붙었습니다."));

  box.append(two);

  box.append(card("없는데 넣으면 좋은 것","g",miss,line,"—"));

  if(bad.length)box.append(el("div",{class:"note wa"},

    el("b",{},"빼고 확인하는 방법. "),

    "A/B로 가르지 않습니다. 위 「빼세요」를 통째로 빼고 그대로 태워, 그래도 잘 나오면 빼는 게 맞습니다."));

}

function 짧은날(d){
  const x=String(d||"");
  return /^\d{4}-\d{2}-\d{2}$/.test(x) ? x.slice(2).replace(/-/g,".") : "";

}
function bootFail(e){
  $("#main").innerHTML="";
  $("#main").append(el("h2",{},"데이터를 못 받았습니다"),
    el("p",{class:"lede"},String(e&&e.message||e)),
    el("p",{class:"dim"},"로컬에서 파일로 열었다면 실행.bat으로 여세요 — 브라우저가 파일 읽기를 막습니다."));
}
if(DATA) boot(DATA);
else if(typeof window.HYP_LOAD==="function")
  window.HYP_LOAD().then(boot).catch(bootFail);
else bootFail(new Error("데이터를 어디서 받을지 정해지지 않았습니다"));
</script>
