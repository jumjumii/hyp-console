<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베이스튠 가설 프로그램</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231a1d21%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E%EA%B0%80%3C/text%3E%3C/svg%3E">
<style>
/* 잉크와 종이. 중성색은 푸른 쪽으로 살짝 기울이고 강조는 코발트 하나만 쓴다.
   성공·실패는 강조색과 분리한다 — 상태는 상태색으로만 읽혀야 한다. */
:root{
  --paper:#fff; --bg:#f5f7fa; --ink:#0a0c10; --ink2:#39414c; --ink3:#6e7885; --ink4:#a3abb7;
  --line:#e3e7ed; --line2:#c9d0da; --tint:#eef2f7;
  --acc:#0f3fd8; --acc2:#e8eefd; --acc3:#0a2ea8;
  --ok:#04684b; --ok2:#e4f4ed; --no:#ba0f3d; --no2:#fdeaf0;
  --wa:#8a5200; --wa2:#fdf1dc; --run:#1c5c9e; --run2:#e6f0f9;
  --r:11px; --rs:8px; --sh:0 1px 2px rgba(10,12,16,.06),0 1px 1px rgba(10,12,16,.03);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#13161c; --bg:#090b0f; --ink:#f1f4f8; --ink2:#c1c9d4; --ink3:#88919e; --ink4:#59616d;
  --line:#232830; --line2:#333a45; --tint:#191d24;
  --acc:#7fa0ff; --acc2:#141c33; --acc3:#a9c0ff;
  --ok:#46dc9d; --ok2:#0d2620; --no:#ff819a; --no2:#2a111a;
  --wa:#e9b664; --wa2:#291f12; --run:#7ab4ea; --run2:#101f2d;
  --sh:0 1px 2px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#13161c; --bg:#090b0f; --ink:#f1f4f8; --ink2:#c1c9d4; --ink3:#88919e; --ink4:#59616d;
  --line:#232830; --line2:#333a45; --tint:#191d24;
  --acc:#7fa0ff; --acc2:#141c33; --acc3:#a9c0ff;
  --ok:#46dc9d; --ok2:#0d2620; --no:#ff819a; --no2:#2a111a;
  --wa:#e9b664; --wa2:#291f12; --run:#7ab4ea; --run2:#101f2d;
  --sh:0 1px 2px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --paper:#fff; --bg:#f5f7fa; --ink:#0a0c10; --ink2:#39414c; --ink3:#6e7885; --ink4:#a3abb7;
  --line:#e3e7ed; --line2:#c9d0da; --tint:#eef2f7;
  --acc:#0f3fd8; --acc2:#e8eefd; --acc3:#0a2ea8;
  --ok:#04684b; --ok2:#e4f4ed; --no:#ba0f3d; --no2:#fdeaf0;
  --wa:#8a5200; --wa2:#fdf1dc; --run:#1c5c9e; --run2:#e6f0f9;
  --sh:0 1px 2px rgba(10,12,16,.06),0 1px 1px rgba(10,12,16,.03);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
b,strong{font-weight:650}
.wrap{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}
nav{background:var(--paper);border-right:1px solid var(--line);padding:20px 12px;
  position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1px}
nav h1{font-size:14.5px;margin:0;padding:0 9px;letter-spacing:-.35px;font-weight:700}
nav .sub{font-size:11px;color:var(--ink4);padding:4px 9px 0;margin-bottom:16px;line-height:1.5}
nav .lab{font-size:9.5px;color:var(--ink4);letter-spacing:1px;padding:15px 9px 5px;font-weight:700}
nav button{all:unset;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--rs);
  font-size:13px;color:var(--ink2);cursor:pointer;transition:background .12s}
nav button:hover{background:var(--tint)}
nav button[aria-current="true"]{background:var(--acc2);color:var(--acc);font-weight:650}
nav button i{font-style:normal;font-size:9.5px;width:17px;height:17px;border-radius:99px;flex:none;
  display:grid;place-items:center;background:var(--tint);color:var(--ink3);font-weight:700;
  border:1px solid var(--line)}
nav button[aria-current="true"] i{background:var(--acc);color:var(--paper);border-color:var(--acc)}
nav .foot{margin-top:auto;font-size:11.5px;color:var(--ink4);padding:12px 9px 0;
  border-top:1px solid var(--line);line-height:1.65}
main{padding:26px 30px 90px;min-width:0}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  nav h1,nav .sub,nav .lab,nav .foot{display:none}main{padding:18px 15px 60px}}
h2{font-size:24px;margin:0 0 5px;letter-spacing:-.7px;font-weight:700}
h3{font-size:14px;margin:0 0 11px;letter-spacing:-.2px;font-weight:650}
.eyebrow{font-size:11.5px;letter-spacing:1.2px;color:var(--ink4);font-weight:700;margin:0 0 7px}
.lede{color:var(--ink3);font-size:12.5px;margin:0 0 20px;max-width:82ch;line-height:1.6}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:8px;margin:0 0 18px}
.kpi div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:25px;letter-spacing:-1.1px;line-height:1.08;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--ink4);display:block;margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:8px;margin:0 0 20px}
.steps a{text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;cursor:pointer;display:block;box-shadow:var(--sh);
  transition:border-color .12s,transform .12s}
.steps a:hover{border-color:var(--acc);transform:translateY(-1px)}
.steps a.on{border-color:var(--acc);background:var(--acc2)}
.steps b{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:3px}
.steps em{font-style:normal;background:var(--tint);border:1px solid var(--line);color:var(--ink3);
  width:19px;height:19px;border-radius:99px;display:grid;place-items:center;font-size:10px;font-weight:700}
.steps a.on em{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.steps span{font-size:11.5px;color:var(--ink4)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 19px;margin:0 0 12px;box-shadow:var(--sh)}
.card.tight{padding:13px 15px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;align-items:start}
.two>*{min-width:0}  /* 이게 없으면 넓은 표가 칸을 밀어내 옆 카드를 덮는다 */
/* 표가 길다(소재 189행). 상세가 따라다녀야 아래쪽을 눌러도 옆에서 볼 수 있다 */
@media(min-width:1401px){.two>*:last-child{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
@media(max-width:1400px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th.l,td.l{text-align:left;font-variant-numeric:normal}
th{position:sticky;top:0;background:var(--tint);font-size:11.5px;color:var(--ink3);z-index:1;
  cursor:pointer;user-select:none;font-weight:650;letter-spacing:.3px;border-bottom:1px solid var(--line2)}
th:hover{color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--tint)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:650;
  line-height:1.5;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok2)} .p-no{color:var(--no);background:var(--no2)}
.p-wa{color:var(--wa);background:var(--wa2)} .p-run{color:var(--run);background:var(--run2)}
.p-dim{color:var(--ink3);background:var(--tint)}
.g{color:var(--ok);font-weight:650} .b{color:var(--no);font-weight:650}
.mut{color:var(--ink2)} .dim{color:var(--ink4)}
button.btn,select,input,textarea{font:inherit;color:var(--ink);background:var(--paper);
  border:1px solid var(--line2);border-radius:var(--rs);padding:6px 10px}
button.btn{cursor:pointer;font-size:12.5px;font-weight:600;transition:background .12s,border-color .12s}
button.btn:hover{background:var(--tint);border-color:var(--ink4)}
button.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.btn.pri:hover{background:var(--acc3);border-color:var(--acc3)}
button.btn.sm{padding:3px 9px;font-size:11.5px}
:is(button,select,input,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips label{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;
  border:1px solid var(--line2);border-radius:99px;cursor:pointer;background:var(--paper);transition:border-color .12s}
.chips label:hover{border-color:var(--ink4)}
.chips label:has(input:checked){border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:650}
.chips input{margin:0;accent-color:var(--acc)}
.chips.bad label:has(input:checked){border-color:var(--no);background:var(--no2);color:var(--no)}
.chips.bad input{accent-color:var(--no)}
.chips.good label:has(input:checked){border-color:var(--ok);background:var(--ok2);color:var(--ok)}
.chips.good input{accent-color:var(--ok)}
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .badge{flex:none;width:22px;height:22px;border-radius:99px;background:var(--acc2);color:var(--acc);
  display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.next{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.note{border-left:3px solid var(--line2);padding:11px 15px;border-radius:0 var(--rs) var(--rs) 0;
  margin:11px 0;font-size:12.5px;background:var(--tint);line-height:1.6}
.note.no{border-color:var(--no);background:var(--no2)}
.note.ok{border-color:var(--ok);background:var(--ok2)}
.note.wa{border-color:var(--wa);background:var(--wa2)}
.empty{color:var(--ink4);font-size:12.5px;padding:22px 4px;text-align:center}
.meter{height:5px;background:var(--tint);border-radius:99px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px}
.gauge{height:7px;background:var(--tint);border-radius:99px;position:relative;margin:7px 0 3px}
.gauge i{position:absolute;top:0;bottom:0;left:0;border-radius:99px}
.gauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink4);opacity:.5}
.spark{display:flex;gap:2px;align-items:flex-end;height:32px}
.spark i{flex:1;background:var(--acc);opacity:.38;border-radius:2px 2px 0 0;min-height:2px}
.spark i.last{opacity:1}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.ed{grid-template-columns:1fr}}
.pane{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden;box-shadow:var(--sh)}
.pane.focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.pane header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;
  align-items:center;background:var(--tint)}
.pane textarea{width:100%;border:0;border-radius:0;padding:14px;min-height:320px;resize:vertical;
  font-size:13.5px;line-height:1.8;background:transparent}
.pane textarea:focus-visible{outline:none}
.pane footer{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink4);
  display:flex;gap:12px;flex-wrap:wrap}
.quote{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;margin:0 0 7px;
  cursor:pointer;background:var(--paper);transition:border-color .12s}
.quote:hover{border-color:var(--acc)}
.quote .h{display:flex;gap:7px;align-items:center;font-size:11px;margin-bottom:4px}
.quote .s{font-size:12.5px;line-height:1.55}
.wkcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 16px;margin:0 0 9px;box-shadow:var(--sh);border-left:3px solid var(--line2)}
.wkcard.go{border-left-color:var(--ok)}
.wkcard.stop{border-left-color:var(--no)}
.wkhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.wkhead b{font-size:14px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.cellx{background:var(--paper);padding:7px 10px}
.cellx span{display:block;font-size:10px;color:var(--ink4);margin-bottom:2px}
.cellx b{font-size:13px;font-variant-numeric:tabular-nums}
.hrow{display:flex;gap:9px;align-items:flex-start;margin-top:11px}
.hlab{font-size:10px;letter-spacing:.8px;color:var(--ink4);font-weight:700;
  padding-top:4px;flex:none;width:78px}
.hchips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.hchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 4px;
  border-radius:99px;border:1px solid var(--line2);background:var(--paper);max-width:100%}
.hchip i{font-style:normal;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px;flex:none}
.hchip.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.hchip.ok i{background:var(--ok2);color:var(--ok)}
.hchip.no{border-color:color-mix(in srgb,var(--no) 40%,transparent)}
.hchip.no i{background:var(--no2);color:var(--no)}
.hchip.dim i{background:var(--tint);color:var(--ink4)}
.hmore{margin-top:9px}
.hmore summary{cursor:pointer;font-size:11.5px;color:var(--ink4);padding:3px 0}
.quote .ord{width:16px;height:16px;border-radius:99px;background:var(--tint);color:var(--ink3);
  display:grid;place-items:center;font-size:9.5px;font-weight:700;border:1px solid var(--line)}
.srcbar{display:flex;gap:7px;align-items:center;padding:7px 2px 8px;
  border-bottom:1px solid var(--line2);margin-bottom:8px}
.srcbar b{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.kpi3{grid-template-columns:repeat(3,1fr)}
.kpi .kpi2{display:block;font-style:normal;font-size:12px;color:var(--ink4);margin-top:3px}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px}
table.tt th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink4);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tt th.n{text-align:right}
table.tt td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.tt tbody tr:hover{background:var(--line2)}
td.sm{font-size:12.5px;max-width:420px;white-space:normal;line-height:1.45}
td.sm2{font-size:12.5px;max-width:340px;white-space:normal;line-height:1.45}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin:8px 0 18px}
.gbox{border:1px solid var(--line);border-radius:6px;margin:0 0 10px;padding:0 12px}
.gbox summary{cursor:pointer;padding:10px 0;font-size:14px}
.lrow{margin:0 0 5px;font-size:13px;line-height:1.5}
.lrow .n{font-variant-numeric:tabular-nums}
.qbar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.qb{font-size:13px;padding:6px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink3);cursor:pointer}
.qb:hover{color:var(--ink)}
.qb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar.filt{gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin:10px 0 96px}
.icard{border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--paper)}
.icard.on{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.icard .iax{margin:0;font-size:11.5px;letter-spacing:.04em;color:var(--ink4);text-transform:none}
.icard .ival{margin:3px 0 8px;font-size:16px;font-weight:700;line-height:1.35}
.icard .inum{margin:7px 0 0;font-size:13px}
.icard .inum b{font-size:15px}
.pbar{position:relative;height:7px;border-radius:4px;background:var(--line2);overflow:visible}
.pbar i{display:block;height:100%;border-radius:4px}
.pbar{margin-bottom:2px}
.pbar u{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);border-radius:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}
.basket{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:11px 14px;margin:16px 0 0;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.basket .pill{cursor:pointer}
.advrow{padding:6px 0;border-top:1px solid var(--line)}
.advrow:first-of-type{border-top:0}
.vd{padding:9px 0;border-top:1px solid var(--line)}
.vd:first-of-type{border-top:0}
.vraw{margin:2px 0 0;font-size:12.5px;color:var(--ink3);padding-left:10px}
.vraw b{color:var(--ink4);font-weight:500;margin-right:4px}
.rtrend{display:flex;flex-direction:column;gap:5px}
.rt{display:grid;grid-template-columns:52px 1fr 46px 64px;gap:10px;align-items:center;font-size:13px}
.rtl{color:var(--ink4);font-family:inherit}
.rtb{position:relative;height:9px;border-radius:5px;background:var(--line2)}
.rtb i{display:block;height:100%;border-radius:5px}
.rtb u{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);border-radius:1px}
.rt b{text-align:right;font-variant-numeric:tabular-nums}
.rt .dim{text-align:right;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:70px}
.spark i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;opacity:.75}
.spark i:hover{opacity:1}

.nxg{margin:14px 0 6px;font-size:13px;letter-spacing:.04em;color:var(--ink3);text-transform:none}
.nxs{border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin:0 0 8px;background:var(--paper)}
.nxs select{width:100%}
.nxax{font-size:12px}
.nxl{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.nxq{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--ink2);
     padding-left:9px;border-left:2px solid var(--line2)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin:8px 0}
.mcard{border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;background:var(--paper);min-width:0}
.mcard h4{margin:0 0 5px;font-size:13px}
.mrow{margin:0 0 3px;font-size:13px;line-height:1.5;display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
/* 판정 딱지. 화면의 다른 알약(.pill)과 같은 모양으로 맞춘다 — 회색 네모는
   이 화면에 없던 모양이라 혼자 떠 보였다. 중립은 칠하지 않고 테두리만 둔다.
   글자가 칸을 넘지 않게: 줄바꿈 없음 · 줄어들지 않음 · 최소 너비를 둔다.
   말이 바뀌어도 칸이 따라오도록 딱지가 든 격자 칸은 이 너비에 맞춰 잡는다. */
.mk{display:inline-block;font-size:11px;font-weight:650;line-height:1.5;

.mk.no{background:var(--no2);color:var(--no);border-color:var(--no2)}
.mk.maybe{background:var(--wa2);color:var(--wa);border-color:var(--wa2)}
.mv{font-weight:600}
.mx{font-size:12px}
.nxmust{border-color:var(--ok);box-shadow:inset 2px 0 0 var(--ok)}
.nxbad{border-color:var(--no);box-shadow:inset 2px 0 0 var(--no)}

.irows{display:flex;flex-direction:column}

  gap:8px;align-items:center;padding:4px 6px;border-radius:4px;font-size:13px;min-width:0}

.irow.on{background:var(--ok2)}

.irow .ia,.irow .it{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .in2{white-space:nowrap;font-size:12.5px;overflow:hidden}

.irow .ib i{position:absolute;left:0;top:0;bottom:0;display:block}
.irow .ib u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink4)}

/* 글 속에서 누르는 것 — 성공작 이름, 담기, 접기 같은 것.

/* 손으로 짠 표도 제목을 눌러 정렬되게 한다. table()로 만든 표만 정렬이 됐고

   숫자가 아니면 글자로 견준다. 「1,234만」·「12일」·「—」를 다 다룬다. (2026-08-26) */
function 표정렬(tb){
  const thead=tb.querySelector("thead"), tbody=tb.querySelector("tbody");
  if(!thead||!tbody) return tb;
  const ths=[].slice.call(thead.querySelectorAll("th"));
  let 지금=null, 향=-1;
  const 숫자=(s2)=>{
    const t=String(s2||"").replace(/,/g,"").trim();
    if(!t||t==="—"||t==="-") return null;
    const m=t.match(/-?[0-9]+(?:\.[0-9]+)?/);
    if(!m) return null;
    let v=parseFloat(m[0]);
    if(/억/.test(t)) v*=1e8; else if(/만/.test(t)) v*=1e4;
    return v;
  };
  ths.forEach((th,i)=>{
    th.style.cursor="pointer";
    th.addEventListener("click",()=>{
      if(지금===i) 향=-향; else { 지금=i; 향=-1; }
      ths.forEach((x,j)=>{ x.textContent=x.textContent.replace(/ [↓↑]$/,"");
                           if(j===i) x.textContent+= (향<0?" ↓":" ↑"); });
      const rs=[].slice.call(tbody.querySelectorAll("tr"));
      rs.sort((a,b)=>{
        const A=(a.children[i]||{}).textContent||"", B=(b.children[i]||{}).textContent||"";
        const x=숫자(A), y=숫자(B);
        const d=(x!==null&&y!==null) ? (x-y) : String(A).localeCompare(String(B));
        return d*(향<0?-1:1);
      });
      rs.forEach(r=>tbody.appendChild(r));
    });
  });
  return tb;
}

/* ─── 추세 그림 ────────────────────────────────────────────────────────────
   외부 그림 꾸러미를 쓰지 않는다. 콘솔은 파일로 열어도, 인터넷이 막힌 자리에서도
   열려야 한다. SVG를 직접 그린다 — 그린다고 못생길 이유는 없다.

   지표를 하나씩 본다. 한 화면에 비율과 금액을 같이 넣으면 눈금이 둘이 되고
   둘 다 못 읽는다. 탭으로 갈아 끼운다.

   곡선은 카트멀-롬을 삼차 베지에로 옮겨 그린다 — 점을 지나면서 부드럽다.
   그냥 이어 그으면 꺾인 자국이 남는다. */
const SV = "http://www.w3.org/2000/svg";
const sv = (t, a) => { const n = document.createElementNS(SV, t);
  for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]); return n; };

/* 점을 지나는 부드러운 길 — 단조 삼차(프리치-칼슨).
   그냥 카트멀-롬으로 휘면 두 점 사이가 원래 값보다 위로 솟았다 내려간다.
   1.05와 1.10 사이에 1.18짜리 봉우리가 생기는 식이라, 없는 주가 있는 것처럼
   보인다. 단조 삼차는 점 사이를 넘어서지 않는다 — 부드럽되 거짓말은 안 한다. */
function smoothPath(P){
  const n=P.length;
  if(n<2) return "";
  if(n===2) return `M${P[0][0]},${P[0][1]}L${P[1][0]},${P[1][1]}`;
  const dx=[], dy=[], dl=[];
  for(let i=0;i<n-1;i++){ dx.push(P[i+1][0]-P[i][0]); dy.push(P[i+1][1]-P[i][1]);
    dl.push(dx[i]?dy[i]/dx[i]:0); }
  const m=[dl[0]];
  for(let i=1;i<n-1;i++){
    if(dl[i-1]*dl[i]<=0) m.push(0);
    else{ let v=(dl[i-1]+dl[i])/2;
      const lim=3*Math.min(Math.abs(dl[i-1]),Math.abs(dl[i]));
      m.push(Math.sign(v)*Math.min(Math.abs(v),lim)); }
  }
  m.push(dl[n-2]);
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h=dx[i]/3;
    d+=`C${P[i][0]+h},${P[i][1]+m[i]*h} ${P[i+1][0]-h},${P[i+1][1]-m[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`;
  }
  return d;
}

const CH_MET = [
  {k:"roas", t:"직접 ROAS", c:"#4f7fff", f:r=>r.sp?r.nt/r.sp:0,  fmt:v=>v.toFixed(2), cut:()=>D.cut},
  {k:"cpa",  t:"직접 CPA",  c:"#ef4444", f:r=>r.od?r.sp/r.od:0,   fmt:v=>v>=10000?(v/10000).toFixed(1)+"만":num(v), low:true},
  {k:"sp",   t:"지출",      c:"#f59e0b", f:r=>r.sp,               fmt:v=>man(v)},
  {k:"nt",   t:"매출",      c:"#22c55e", f:r=>r.nt,               fmt:v=>man(v)},
  {k:"aov",  t:"객단가",    c:"#a78bfa", f:r=>r.od?r.nt/r.od:0,   fmt:v=>man(v)},
  {k:"od",   t:"주문",      c:"#14b8a6", f:r=>r.od||0,            fmt:v=>num(v)+"건"},
];

/* rows: [{k, sp, nt, od}] */
function trendChart(rows, st) {
  const box = el("div", {class: "chart"});
  const tabs = el("div", {class: "cmet"});
  const host = el("div", {class: "cwrap"});
  CH_MET.forEach(m => tabs.append(el("button", {
    class: "cmb" + (st.met === m.k ? " on" : ""),
    style: st.met === m.k ? `--mc:${m.c}` : null,
    onclick: () => { st.met = m.k; draw(); }}, m.t)));
  box.append(tabs, host);

  function draw() {
    [...tabs.children].forEach((b, i) => {
      const on = CH_MET[i].k === st.met;
      b.className = "cmb" + (on ? " on" : "");
      b.style.setProperty("--mc", CH_MET[i].c);
    });
    host.innerHTML = "";
    if (!rows.length) { host.append(el("p", {class: "dim"}, "그릴 것이 없습니다.")); return; }
    const M = CH_MET.find(x => x.k === st.met) || CH_MET[0];
    const W = 1400, H = 300, P = {t: 22, r: 20, b: 34, l: 74};
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const vals = rows.map(M.f);
    const cut = M.cut ? M.cut() : null;
    const hi = Math.max(...vals, cut || 0) * 1.12 || 1;
    const x = i => P.l + (rows.length === 1 ? iw / 2 : iw * i / (rows.length - 1));
    const y = v => P.t + ih - ih * Math.max(0, Math.min(v, hi)) / hi;

    const g = sv("svg", {viewBox: `0 0 ${W} ${H}`, class: "csvg",
                         role: "img", "aria-label": `${M.t} 추세`});
    const gid = "cg" + st.met;
    const defs = sv("defs", {});
    const lg = sv("linearGradient", {id: gid, x1: 0, y1: 0, x2: 0, y2: 1});
    lg.appendChild(sv("stop", {offset: "0%",   "stop-color": M.c, "stop-opacity": 0.22}));
    lg.appendChild(sv("stop", {offset: "100%", "stop-color": M.c, "stop-opacity": 0}));
    defs.appendChild(lg); g.appendChild(defs);

    for (let i = 0; i <= 4; i++) {
      const v = hi * i / 4, yy = y(v);
      g.appendChild(sv("line", {x1: P.l, x2: W - P.r, y1: yy, y2: yy, class: "cgrid"}));
      const t = sv("text", {x: P.l - 11, y: yy + 5, class: "clab", "text-anchor": "end"});
      t.textContent = M.fmt(v); g.appendChild(t);
    }
    if (cut != null) {
      const yc = y(cut);
      g.appendChild(sv("line", {x1: P.l, x2: W - P.r, y1: yc, y2: yc, class: "ccut"}));
      const ct = sv("text", {x: W - P.r - 4, y: yc - 8, class: "clab ccutt", "text-anchor": "end"});
      ct.textContent = `컷 ${cut}`; g.appendChild(ct);
    }

    const pts = rows.map((r, i) => [x(i), y(vals[i])]);
    const line = smoothPath(pts);
    g.appendChild(sv("path", {d: `${line}L${pts[pts.length-1][0]},${P.t+ih}L${pts[0][0]},${P.t+ih}Z`,
                              fill: `url(#${gid})`, stroke: "none"}));
    g.appendChild(sv("path", {d: line, fill: "none", stroke: M.c, "stroke-width": 2.5,
                              "stroke-linecap": "round", "stroke-linejoin": "round"}));
    pts.forEach((p, i) => {
      const good = cut != null ? (M.low ? vals[i] <= cut : vals[i] >= cut) : null;
      g.appendChild(sv("circle", {cx: p[0], cy: p[1], r: 5, class: "cdot",
        fill: good === null ? M.c : (good ? "var(--ok)" : "var(--no)")}));
    });

    const step = Math.ceil(rows.length / Math.max(2, Math.floor(iw / 96)));
    rows.forEach((r, i) => {
      if (i % step && i !== rows.length - 1) return;
      const t = sv("text", {x: x(i), y: H - 10, class: "clab", "text-anchor": "middle"});
      t.textContent = r.k; g.appendChild(t);
    });

    const vline = sv("line", {x1: 0, x2: 0, y1: P.t, y2: P.t + ih, class: "cv", opacity: 0});
    const ring = sv("circle", {r: 9, class: "cring", opacity: 0});
    const hit = sv("rect", {x: 0, y: 0, width: W, height: H, fill: "transparent"});
    g.appendChild(vline); g.appendChild(ring); g.appendChild(hit);
    const tip = el("div", {class: "ctip", style: "display:none"});
    hit.addEventListener("mousemove", e => {
      const b = g.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width * W;
      let i = 0, best = 1e9;
      pts.forEach((p, j) => { const d = Math.abs(p[0] - px); if (d < best) { best = d; i = j; } });
      vline.setAttribute("x1", pts[i][0]); vline.setAttribute("x2", pts[i][0]);
      vline.setAttribute("opacity", 1);
      ring.setAttribute("cx", pts[i][0]); ring.setAttribute("cy", pts[i][1]);
      ring.setAttribute("stroke", M.c); ring.setAttribute("opacity", 1);
      const r = rows[i];
      tip.innerHTML = `<b>${r.k}</b>` + CH_MET.map(mm =>
        `<span class="ck" style="background:${mm.c}"></span>${mm.t} <b>${mm.fmt(mm.f(r))}</b>`).join("<br>");
      tip.style.display = "block";
      const lx = pts[i][0] / W * b.width;
      tip.style.left = Math.min(b.width - 168, Math.max(0, lx - 76)) + "px";
    });
    hit.addEventListener("mouseleave", () => {
      vline.setAttribute("opacity", 0); ring.setAttribute("opacity", 0); tip.style.display = "none"; });
    host.append(g, tip);
  }
  draw();
  return box;
}

/* 여러 줄을 겹쳐 그린다. series: [{name, color, pts:[{k,sp,nt,od}]}]
   눈금 이름은 줄마다 다를 수 있다 — 어떤 소구는 3월에 안 돌았다. 이름을 모아
   가로축을 하나로 만들고, 없는 칸은 선을 끊는다. 0으로 이으면 안 쓴 달이
   폭락한 달처럼 보인다. */
function multiChart(series, met){
  const box = el("div", {class: "chart"});
  const host = el("div", {class: "cwrap"});
  box.append(host);
  if(!series.length){ host.append(el("p",{class:"dim"},"소구를 하나 이상 고르세요.")); return box; }
  const M = CH_MET.find(x=>x.k===met) || CH_MET[0];
  const keys = [...new Set(series.flatMap(s=>s.pts.map(p=>p.k)))].sort();
  if(!keys.length){ host.append(el("p",{class:"dim"},"그릴 것이 없습니다.")); return box; }

  const W=1400, H=320, P={t:22,r:20,b:34,l:74};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const cut = M.cut ? M.cut() : null;
  const val = p => M.f(p);
  const all = series.flatMap(s=>s.pts.map(val));
  const hi = Math.max(...all, cut||0) * 1.12 || 1;
  const x = i => P.l + (keys.length===1 ? iw/2 : iw*i/(keys.length-1));
  const y = v => P.t + ih - ih*Math.max(0,Math.min(v,hi))/hi;

  const g = sv("svg",{viewBox:`0 0 ${W} ${H}`, class:"csvg", role:"img",
                      "aria-label":`소구별 ${M.t}`});
  for(let i=0;i<=4;i++){
    const v=hi*i/4, yy=y(v);
    g.appendChild(sv("line",{x1:P.l,x2:W-P.r,y1:yy,y2:yy,class:"cgrid"}));
    const t=sv("text",{x:P.l-11,y:yy+5,class:"clab","text-anchor":"end"});
    t.textContent=M.fmt(v); g.appendChild(t);
  }
  if(cut!=null){
    const yc=y(cut);
    g.appendChild(sv("line",{x1:P.l,x2:W-P.r,y1:yc,y2:yc,class:"ccut"}));
    const ct=sv("text",{x:W-P.r-4,y:yc-8,class:"clab ccutt","text-anchor":"end"});
    ct.textContent=`컷 ${cut}`; g.appendChild(ct);
  }
  const at = {};
  series.forEach(s=>{
    const by={}; s.pts.forEach(p=>by[p.k]=p);
    at[s.name]=by;
    /* 이어진 구간마다 따로 긋는다 — 빠진 칸에서 끊는다 */
    let run=[];
    const flush=()=>{ if(run.length>1) g.appendChild(sv("path",{d:smoothPath(run),fill:"none",
        stroke:s.color,"stroke-width":2.5,"stroke-linecap":"round","stroke-linejoin":"round"}));
      else if(run.length===1) g.appendChild(sv("circle",{cx:run[0][0],cy:run[0][1],r:3,fill:s.color}));
      run=[]; };
    keys.forEach((k,i)=>{ const p=by[k]; if(!p){flush();return;} run.push([x(i),y(val(p))]); });
    flush();
    keys.forEach((k,i)=>{ const p=by[k]; if(!p)return;
      g.appendChild(sv("circle",{cx:x(i),cy:y(val(p)),r:4,class:"cdot",fill:s.color})); });
  });
  const step=Math.ceil(keys.length/Math.max(2,Math.floor(iw/96)));
  keys.forEach((k,i)=>{
    if(i%step && i!==keys.length-1) return;
    const t=sv("text",{x:x(i),y:H-10,class:"clab","text-anchor":"middle"});
    t.textContent=k.length>7?k.slice(5):k; g.appendChild(t);
  });

  const vline=sv("line",{x1:0,x2:0,y1:P.t,y2:P.t+ih,class:"cv",opacity:0});
  const hit=sv("rect",{x:0,y:0,width:W,height:H,fill:"transparent"});
  g.appendChild(vline); g.appendChild(hit);
  const tip=el("div",{class:"ctip",style:"display:none"});
  hit.addEventListener("mousemove",e=>{
    const b=g.getBoundingClientRect();
    const px=(e.clientX-b.left)/b.width*W;
    let i=0,best=1e9;
    keys.forEach((k,j)=>{const d=Math.abs(x(j)-px); if(d<best){best=d;i=j;}});
    vline.setAttribute("x1",x(i)); vline.setAttribute("x2",x(i)); vline.setAttribute("opacity",1);
    const rows=series.map(s=>({s, p:at[s.name][keys[i]]})).filter(o=>o.p)
      .sort((a,b)=>val(b.p)-val(a.p));
    tip.innerHTML=`<b>${keys[i]}</b>`+rows.map(o=>
      `<br><span class="ck" style="background:${o.s.color}"></span>${o.s.name} <b>${M.fmt(val(o.p))}</b>`+
      `<span class="dim"> ${o.p.d}편 ${man(o.p.sp)}</span>`).join("");
    tip.style.display="block";
    tip.style.left=Math.min(b.width-215,Math.max(0,x(i)/b.width*0+x(i)/W*b.width-100))+"px";
  });
  hit.addEventListener("mouseleave",()=>{vline.setAttribute("opacity",0);tip.style.display="none";});
  host.append(g,tip);
  return box;
}
/* ─── 원고 쓰기 ────────────────────────────────────────────────────────────
   가설을 담아 왔으면 여기서 쓴다. 순서를 정해 놓고 몰아가지 않는다 — 쓰다가
   막히는 자리가 사람마다 다르다. 후킹이 안 떠오르면 후킹을, 소구가 고민이면
   소구를 눌러서 그 자리만 파고든다.

   한 요소를 누르면 두 층이 나온다.
     ① 어떤 종류가 잘되나   그동안 · 최근 · 이번 주를 같이 본다
     ② 실제로 어떻게 썼나   그 종류 안의 워딩과, 그 워딩을 쓴 성공작의 실제 문장
   보고 나서 그 자리에 바로 쓴다. */

const WR_ORDER = ["형식","페르소나","구조","훅","소구","근거","기전","CTA"];
const WR_GRP = {형식:"영상형식"};                 // 화면에 쓸 이름 → 판정 묶음 이름
const wrGrp = g => WR_GRP[g] || g;
let WR = {g:"훅", ax:null, v:null, read:null, text:{}, name:"", fmt:""};

/* 갈래로 쓰이는 축은 ①에 올리지 않는다. ①은 「어떤 종류로 갈까」를 고르는 자리다. */
let WR_BRANCH=null;
function wrBranchAx(){
  if(WR_BRANCH) return WR_BRANCH;
  WR_BRANCH=new Set();
  D.idea.forEach(x=>h3Branches(x.ax,x.v).forEach(b=>WR_BRANCH.add(b.a)));
  return WR_BRANCH;
}
const wrTop = ax => !wrBranchAx().has(ax) && !ax.includes(" · ") && !/계열$/.test(ax);

/* 그 묶음에서 고를 수 있는 종류 */
function wrKinds(g){
  const gg=wrGrp(g);
  return D.idea.filter(x=>x.grp===gg && wrTop(x.ax) && x.n>=3)
    .sort((a,b)=>b.rt-a.rt||b.n-a.n);
}
/* 최근 — 판정을 이전 절반과 최근 절반으로 가른 그 최근이다. 이번 주와 다르다. */
const wrLate = x => x.nL ? {n:x.nL, w:x.wL, rt:x.wL/x.nL} : null;

function wrMark(x){
  if(x.ref) return {t:"참고", c:"ref"};   // 판정 문서가 뺀 축
  if(x.ban || (x.n>=5&&x.w===0) || (x.split&&x.n>=5&&x.lf<=-0.15)) return {t:"금지", c:"no"};
  if(x.split&&x.n>=5&&x.lf>=0.15) return {t:"추천", c:"yes"};
  if(x.lf>=0.15) return {t:"대기", c:"maybe"};
  return {t:"—", c:"none"};
}
const wrBar = rt => el("span",{class:"lyb"},
  el("i",{style:`width:${Math.max(2,Math.min(100,rt*100))}%;background:${rt>=D.base?"var(--ok)":"var(--no)"}`}),
  el("u",{style:`left:${Math.min(99,D.base*100)}%`,title:`기저 ${pc(D.base)}`}));

/* 그 값을 쓴 성공작 — 이름을 누르면 원고 전문이 열린다 */
function wrWins(ax,v){
  const r=D.vals.find(x=>x.ax===ax&&x.v===v);
  if(!r) return [];
  const det=(r.det||[]).filter(x=>x.st==="성공");
  if(det.length) return det.map(x=>({t:x.t, s:x.first||""}));
  return (r.wins||[]).map(t=>({t, s:""}));
}

function viewWrite(){
  const m=$("#main");m.innerHTML="";
  m.append(el("div",{class:"bar",style:"margin:0 0 2px"},
    el("button",{class:"lnk",onclick:()=>go("build")},"← 원고 빌더로")));
  m.append(el("p",{class:"eyebrow"},"원고 빌더"),
    el("div",{class:"bar",style:"justify-content:space-between;align-items:baseline"},
      el("h2",{style:"margin:0"},"요소별로 파기"),
      el("button",{class:"btn",onclick:()=>{
        DFT={name:WR.name, items:[], hyp:null,
             picks:PICK.slice(), body:WR_ORDER.map(g=>WR.text[g]).filter(Boolean).join("\\n")};
        go("draft");}},"원고 검증으로 넘기기 →")));
  m.append(el("p",{class:"lede"},
    "막히는 자리를 누르세요. 그 요소에서 어떤 종류가 잘되는지, 그 종류를 실제로 어떤 말로 썼는지, "+
    "그 말을 쓴 성공작이 무엇인지까지 폅니다. 보고 나서 아래 칸에 바로 쓰면 됩니다."));

  /* 이름 · 형식 꼬리표 */

/* 그 워딩을 실제로 쓴 문장. 판정 문서가 문장까지 들고 있으면 그걸 그대로 보여준다 —
   원고를 쓸 때 필요한 건 「환율 덕에 싸게 들여왔다 3/4 75%」가 아니라 그 원고가
   실제로 쓴 「유로환율이 낮을 때 들어온거라 가격까지 이쁘게 빠진거죠」다. */
function wrSay(r){
  const ev=r.ev||{};
  const ts=Object.keys(ev);
  if(!ts.length) return wrWinLine(r.ax,r.v);
  const box=el("div",{});
  ts.slice(0,3).forEach(t=>{
    const ok=DR[t]&&DR[t].st==="성공";
    box.append(el("p",{class:"wrs"},
      el("button",{class:"lnk "+(ok?"g":"b"),onclick:()=>{WR.read=t;viewWrite();}},t),
      el("span",{class:"wrq"},` “${ev[t][0]}”`)));
  });
  if(ts.length>3) box.append(el("p",{class:"dim sm2"},`이 워딩을 쓴 원고 ${ts.length}편 중 3편`));
  return box;
}

/* 그 값을 쓴 성공작 이름과 첫 문장 */
function wrWinLine(ax,v){
  const ws=wrWins(ax,v);
  const p=el("p",{class:"wrw"});
  if(!ws.length) return el("p",{class:"dim sm2"},"이 값을 쓴 성공작이 없습니다.");
  p.append(el("span",{class:"dim"},"성공작 "));
  ws.slice(0,4).forEach((w,i)=>p.append(i?" · ":"",
    el("button",{class:"lnk",onclick:()=>{WR.read=w.t;viewWrite();}},w.t)));
  const first=ws.find(w=>w.s);
  if(first) p.append(el("span",{class:"wrq"},` “${first.s}”`));
  return p;
}
/* ─── 소구 성과 ────────────────────────────────────────────────────────────
   위는 전지표 판정의 소구 표 그대로 — 그 소구를 쓴 원고가 몇 편이고 몇 편이
   성공했나. 아래는 같은 소구를 시간으로 편 것 — 언제 잘됐고 언제 식었나.

   메인과 서브를 나눈다. 메인은 「첫 소구」(그 소구로 열었나), 서브는
   「소구 조합(포함)」에서 첫 소구를 뺀 나머지(끼워 넣기만 했나). 둘은 다른 말이다.

   한 원고가 서브를 넷 달았으면 그 원고 지출이 네 소구에 다 들어간다 — 안분하지
   않는다. 합치면 실제 지출보다 커지니 소구끼리만 견준다. */
let SG = {side:"전체", met:"roas", grain:"주", sel:{}};

  서브:"쓰기는 했는데 첫 소구는 아니었던 원고"};

function viewSogu(){
  const m=$("#main");m.innerHTML="";
  /* 목차에 없는 화면이다 — 「소구」에서만 들어온다. 들어왔는데 나갈 데가 없으면

      "메인은 그 소구로 연 원고, 서브는 끼워 넣기만 한 원고입니다."));

  const seg=el("div",{class:"cseg"});
  ["전체","메인","서브"].forEach(k=>seg.append(el("button",{class:"csb"+(SG.side===k?" on":""),

    el("span",{},"성공/편수"),el("span",{title:`기저 ${pc(D.base)} 대비`},"기저 대비"),
    el("span",{},"지출"),

  rs.forEach(x=>{

const SG_COLORS=["#4f7fff","#22c55e","#f59e0b","#ef4444","#a78bfa","#14b8a6","#ec4899","#84cc16",
                 "#0ea5e9","#f97316","#8b5cf6","#06b6d4"];

/* ─── 원고 빌더 ────────────────────────────────────────────────────────────
   원고를 쓸 때 실제로 밟는 순서를 그대로 화면으로 옮긴 것.

     ① 형식      무엇으로 찍을까            제목 꼬리표가 따라 붙는다
     ② 소구·기전  무엇을 주제로, 왜 그런지    메인/서브 배치까지

   1~3에서 고른 것이 4의 오른쪽에 붙박여 있고, 쓰는 동안 그 조건과 어긋나면
   바로 알려 준다. 순서를 강제하지는 않는다 — 어느 단계로든 건너뛸 수 있다.

   숫자는 전부 전지표 판정에서 온다. 「누적」은 판정 전체, 「최근」은 판정된
   원고를 라이브 시작일로 갈라 뒤쪽 절반이다(bE → bL). */
let BD = {step:1, fmt:null, main:null, subs:[], mech:[], hook:null, hookw:[],

/* 값 하나를 쓴 원고의 영상 지표 */
function bdVid(ts){
  let im=0, th=0, sec=0;
  (ts||[]).forEach(t=>{ const v=(DR[t]||{}).v; if(!v||!v.im)return;
    im+=v.im; th+=v.thru*v.im; sec+=v.sec*v.im; });
  return im ? {thru:th/im, sec:sec/im, im} : null;
}
const bdMark = x => wrMark(x);
const bdPct = x => x==null ? "—" : pc(x);
/* 누적과 최근을 나란히 */
function bdNow(x){
  const late = x.nL ? x.wL/x.nL : null;
  return el("span",{class:"bdnow"},
    el("b",{},pc(x.rt)), el("span",{class:"dim"},` ${x.w}/${x.n}편`),
    el("span",{class:"dim"}," · 최근 "),
    late==null ? el("span",{class:"dim"},"—")
      : el("span",{class:late>=D.baseL?"g":"b"},`${pc(late)} ${x.wL}/${x.nL}편`),
    (x.nL && late!=null && late-x.rt>=0.12) ? el("span",{class:"mk yes",style:"margin-left:5px"},"오름") : null);
}

function viewBuild(){
  const m=$("#main");m.innerHTML="";
  m.append(el("p",{class:"eyebrow"},"원고 빌더"),
    el("div",{class:"bar",style:"justify-content:space-between;align-items:baseline"},
      el("h2",{style:"margin:0"},"원고 빌더"),
      el("span",{class:"dim"},`판정 ${D.n}편 · 기저 ${pc(D.base)} (이전 ${pc(D.baseE)} → 최근 ${pc(D.baseL)})`)));

  const nav=el("div",{class:"bdnav"});
  BD_STEPS.forEach(([n,t])=>{
    const done = n===1?BD.fmt : n===2?BD.main : n===3?BD.hook : Object.values(BD.text).some(Boolean);
    nav.append(el("button",{class:"bdb"+(BD.step===n?" on":"")+(done?" ok":""),
      onclick:()=>{BD.step=n;viewBuild();}},
      el("b",{},"STEP "+n), el("span",{},t),
      done?el("span",{class:"bdok"},"✓"):null));
  });
  /* 빌더는 원고 한 편을 짜는 순서다. 그 요소 하나를 더 깊게 보고 싶으면
     「요소별로 파기」로 넘긴다 — 거기엔 빌더가 안 다루는 페르소나·구조·근거도 있다. */
  const WRG={1:"형식",2:"소구",3:"훅",4:"소구"};
  nav.append(el("button",{class:"lnk ic",style:"margin-left:6px",
    title:"이 요소의 종류·워딩·성공작 문장을 더 자세히",
    onclick:()=>{WR.g=WRG[BD.step]||"훅";WR.ax=null;WR.v=null;go("write");}},
    `${WRG[BD.step]||"이 요소"} 더 파기 →`));
  m.append(nav);
  m.append(bdPicked());
  ({1:bdStep1,2:bdStep2,3:bdStep3,4:bdStep4})[BD.step](m);
}

/* 고른 것 — 어느 단계에서나 위에 붙박여 보인다 */
function bdPicked(){
  const box=el("div",{class:"bdpick"});
  const chip=(lab,v,go2)=>el("span",{class:"bdc"+(v?" on":"")},
    el("span",{class:"dim"},lab+" "),
    el("button",{class:"lnk",onclick:()=>{BD.step=go2;viewBuild();}}, v||"안 정함"));
  box.append(chip("형식",BD.fmt,1), chip("메인 소구",BD.main,2),
    chip("서브",BD.subs.join(" · "),2), chip("기전",BD.mech.map(x=>x.v).join(" · "),2),
    chip("후킹",BD.hook,3));
  if(BD.name||BD.fmt) box.append(el("span",{class:"bdc"},
    el("span",{class:"dim"},"광고 이름 "), el("b",{},bdTag())));
  return box;
}
function bdTag(){
  const d=new Date(D.asof.replace(/-/g,"/"));
  const yy=String(d.getFullYear()).slice(2),
        mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  const tail=(String(BD.fmt||"").match(/^[A-Z]+/)||[""])[0];
  return `001_${yy}${mm}${dd}_${BD.name||"이름"}_${tail||"?"}`;
}

/* 실시간 처방전 — 고른 조건과 쓴 글을 견준다 */
function bdAudit(){
  const host=$("#bdaudit"); if(!host) return;
  host.innerHTML="";
  const body=["제목","후킹","본문","CTA"].map(k=>BD.text[k]).join("\n");
  const has=s=>body.indexOf(s)>=0;

  host.append(el("h4",{class:"bdh"},"지금 상태"));
  const chk=(ok,txt,why)=>el("p",{class:"bdchk"},
    el("span",{class:"mk "+(ok?"yes":"none")},ok?"됨":"아직"),
    el("span",{},txt), why?el("span",{class:"dim"}," — "+why):null);

  host.append(chk(!!BD.fmt,"형식", BD.fmt||"안 정함"));
  host.append(chk(!!BD.main,"메인 소구", BD.main||"안 정함"));
  host.append(chk(BD.mech.length>0,`기전 ${BD.mech.length}개`,
    BD.mech.map(x=>x.v).join(" · ")||"안 정함"));
  host.append(chk(!!BD.hook,"후킹 유형", BD.hook||"안 정함"));
  host.append(chk(!!(BD.text.제목||"").trim(),"제목"));
  host.append(chk(!!(BD.text.후킹||"").trim(),"후킹 문장"));
  host.append(chk(!!(BD.text.본문||"").trim(),"본문"));
  host.append(chk(!!(BD.text.CTA||"").trim(),"CTA"));

  /* 금지 — 고른 것 중 판정이 금지인 것 */
  const bans=[...BD.mech].filter(x=>{
    const r=D.vals.find(y=>y.ax===x.ax&&y.v===x.v);
    return r && ((r.n>=5&&r.w===0)||(r.split&&r.n>=5&&r.lf<=-0.15));});
  if(bans.length) host.append(el("div",{class:"note wa"},
    el("b",{},"금지로 판정된 것을 골랐습니다. "),
    bans.map(x=>`「${x.v}」`).join(" · ")));

  /* 놓친 것 — 고른 소구에서 추천인데 안 담은 기전 */
  const miss=[];
  [BD.main,...BD.subs].filter(Boolean).forEach(sg=>{
    (h3Branches("소구",sg)||[]).forEach(b=>b.vs.forEach(r=>{
      if(!(r.split && r.n>=5 && r.lf>=0.15)) return;
      if(BD.mech.some(x=>x.ax===r.ax&&x.v===r.v)) return;
      miss.push({sg, ...r});
    }));
  });

  }

/* ─── 문장 뱅크 ────────────────────────────────────────────────────────────
   쓰다가 막혔을 때 「성공한 원고가 여기서 실제로 뭐라고 썼나」를 바로 찾는 자리.

   판정이 문장까지 들고 있다(part_tab의 ev). 후킹 · 본문 · CTA 어디든 값을 좁혀
   가면 그 값을 쓴 원고의 실제 문장이 나오고, 누르면 복사된다.

   기본은 성공작만 본다. 실패작 문장도 볼 수 있게 두되 꺼 둔다 — 베끼려고 여는
   자리라 실패작이 섞이면 잘못 가져간다. */
let BK = {part:"후킹", g:"", q:"", win:true, sort:"rt", copied:null};

const BK_PARTS = ["후킹","본문","CTA"];
/* 후킹에는 분류가 둘이다 — 문서의 「후킹 소분류」(g 없음)와 워딩이 달린
   「12유형」(g 있음). 섞어 놓으면 같은 줄에 두 분류가 나와 헷갈린다.
   BK.g가 「(소분류)」면 g 없는 것만 본다. */
const BK_TOP = "(소분류)";
const bkRows = () => (D.ptab||[]).filter(r=>r.part===BK.part &&
  (!BK.g ? true : BK.g===BK_TOP ? !r.g : r.g===BK.g));

function bkCopy(txt, el2){
  try{ navigator.clipboard && navigator.clipboard.writeText(txt); }catch(e){}
  BK.copied=txt;
  if(el2){ el2.textContent="복사됨"; setTimeout(()=>{el2.textContent="복사";},1200); }
}

function viewBank(){

  if(nTop) chips.append(el("button",{class:"cmb"+(BK.g===BK_TOP?" on":""),
    title:BK.part==="후킹"?"문서의 「후킹 유형」 — 아래 칩(12유형)과는 다른 분류입니다":"",
    onclick:()=>{BK.g=BK.g===BK_TOP?"":BK_TOP;viewBank();}},
    BK.part==="후킹"?"후킹 소분류":BK.part==="CTA"?"CTA 갈래":"소구", el("span",{class:"dim"},` ${nTop}`)));
  gs.forEach((g,i)=>chips.append(el("button",{class:"cmb"+(BK.g===g?" on":""),
    style:`--mc:${sgColor(i)}`,onclick:()=>{BK.g=BK.g===g?"":g;viewBank();}},
    g, el("span",{class:"dim"},` ${cnt[g]}`))));
  m.append(el("p",{class:"dim",style:"margin:12px 0 4px"},
    BK.part==="후킹"?"후킹은 분류가 둘입니다 — 「후킹 소분류」와 워딩이 달린 「12유형」"
      :BK.part==="본문"?"소구":"CTA 갈래"),chips);

  m.append(el("div",{id:"bkCount",class:"dim",style:"margin:10px 0 0"}),el("div",{id:"bkList"}));
  bkDraw();

function bkDraw(){
  const host=$("#bkList"); if(!host) return;
  host.innerHTML="";
  const s=BK.q.trim();
  let rows=bkRows().filter(r=>r.n>=3);
  const out=[];
  rows.forEach(r=>{
    Object.entries(r.ev||{}).forEach(([t,lines])=>{
      const d=DR[t]; const ok=d&&d.st==="성공";
      if(BK.win && !ok) return;
      (lines||[]).forEach(ln=>{
        if(s && (ln+" "+r.v+" "+t).indexOf(s)<0) return;
        out.push({r, t, ln, ok, roas:(d&&d.r)||0, sp:(d&&d.sp)||0});
      });
    });
  });
  /* 같은 문장이 여러 값에 걸린다 — 한 번만 */
  const seen=new Set(), uniq=[];
  out.forEach(x=>{const k=x.t+"␀"+x.ln; if(seen.has(k))return; seen.add(k); uniq.push(x);});
  uniq.sort((a,b)=>(b.r.rt-a.r.rt)||(b.roas-a.roas));
  $("#bkCount").textContent =
    `문장 ${uniq.length}개 · ${BK.win?"성공작만":"성공·실패 모두"}${BK.g?` · ${BK.g}`:""}` +
    ` — 값 성공률 높은 순. 아래는 ${Math.min(uniq.length,120)}개까지 폅니다`;
  if(!uniq.length){ host.append(el("p",{class:"dim"},"걸린 문장이 없습니다.")); return; }

  let last=null;
  uniq.slice(0,120).forEach(x=>{
    const key=x.r.g+"｜"+x.r.tab+"｜"+x.r.v;
    if(key!==last){
      last=key;
      const mk=wrMark({...x.r, ban:false, split:x.r.out!=="구분 안 됨"});
      host.append(el("div",{class:"bkh"},
        el("span",{class:"mk "+mk.c},mk.t),
        x.r.g?el("span",{class:"dim"},x.r.g+" · "):null,
        el("span",{class:"dim"},x.r.tab+" · "),
        el("b",{},x.r.v),
        el("span",{class:"dim"},` ${x.r.w}/${x.r.n}편 ${pc(x.r.rt)} `),
        el("span",{class:x.r.lf>=0?"g":"b"},pp(x.r.lf))));
    }
    const cp=el("button",{class:"lnk ic"},"복사");
    cp.addEventListener("click",()=>bkCopy(x.ln,cp));
    host.append(el("div",{class:"bkl"},
      el("button",{class:"lnk "+(x.ok?"g":"b"),title:`ROAS ${x.roas.toFixed(2)} · ${man(x.sp)}`,
        onclick:()=>{WR.read=x.t;go("write");}},x.t),
      el("span",{class:"bkq",onclick:()=>bkCopy(x.ln,cp)},`“${x.ln}”`),
      cp));
  });
}
/* ─── 소구 한 장 ───────────────────────────────────────────────────────────
   「이 소구가 지금 잘되고 있나」와 「그 안에서 어떤 근거·기전이 잘되고 있나」를
   한 화면에서 본다.

   여태 두 시제가 따로 놀았다. 판정 성공률은 14일 창이 닫힌 누적이고, ROAS는
   지금 도는 돈이다. 같은 화면에 있어도 이어지지 않아 「지금 되고 있나」에
   답이 안 됐다. 여기서는 값마다 둘을 나란히 놓는다.

     누적   성공률 — 판정이 닫힌 원고만. 무엇이 통했나
     지금   ROAS  — 이번 주·최근 4주. 판정 밖 소재까지 다 센다

   시간축은 값을 가리지 않는다. 「그 값을 쓴 원고」만 있으면 소구든 기전이든
   워딩이든 같은 셈이라, 소재별 주간 성적(dwk)을 원고 목록으로 접기만 하면 된다. */
let DP = {v:null, grain:"주", met:"roas", open:null};

/* 원고 목록 → 시간축 */
function dpSeries(ts, grain){
  const src = grain==="일" ? (D.ddy||{}) : (D.dwk||{});
  const keys = grain==="일" ? (D.dys||[]) : (D.wks||[]);
  const acc = {};
  (ts||[]).forEach(t=>{
    const by=src[t]; if(!by) return;
    for(const k in by){ const a=acc[k]=acc[k]||[0,0,0,0];
      a[0]+=by[k][0]; a[1]+=by[k][1]; a[2]+=by[k][2]; a[3]++; }
  });
  const floor = grain==="일" ? 30000 : 100000;
  return keys.filter(k=>acc[k]&&acc[k][0]>=floor)
    .map(k=>({k:k.slice(5), sp:acc[k][0], nt:acc[k][1], od:acc[k][2], d:acc[k][3]}));
}
/* 지출이 이만큼은 돼야 ROAS를 숫자로 내민다. 8만원에 2.16이 나와도 신호가
   아니라 튄 것이다 — 다른 화면과 같은 문턱을 쓴다. */
const DP_FLOOR = 300000;
/* 최근 n주 합 */
function dpRecent(ts, n){
  const wk=(D.wks||[]).slice(-n), src=D.dwk||{};
  let sp=0,nt=0,od=0; const ds=new Set();
  (ts||[]).forEach(t=>{ const by=src[t]; if(!by)return;
    wk.forEach(k=>{ if(!by[k])return; sp+=by[k][0]; nt+=by[k][1]; od+=by[k][2]; ds.add(t); }); });
  return sp ? {sp, nt, od, roas:nt/sp, cpa:od?sp/od:null, d:ds.size} : null;
}
const dpNum = o => o ? `ROAS ${o.roas.toFixed(2)} · ${man(o.sp)} · ${o.d}편` : "돈이 안 갔습니다";

function viewDeep(){
  const m=$("#main");m.innerHTML="";
  const sgs=D.vals.filter(x=>x.ax==="소구"&&x.n>=8).sort((a,b)=>b.n-a.n);
  if(!DP.v && sgs.length) DP.v=sgs[0].v;
  m.append(el("p",{class:"eyebrow"},"트렌드와 가설"),el("h2",{},"소구"),
    el("p",{class:"lede"},
      "소구 하나에 세 가지를 묻습니다 — ① 지금 쓸 것인가 ② 메인으로 열까 서브로 넣을까 "+
      "③ 그 안에서 무엇으로 밀까. 답이 나오면 아래에서 바로 원고를 쓰러 갑니다."));

  const bar=el("div",{class:"lypick"});
  sgs.forEach(x=>{
    const r=dpRecent(x.ts||dpTs("소구",x.v),4);
    bar.append(el("button",{class:"qb"+(DP.v===x.v?" on":""),
      onclick:()=>{DP.v=x.v;DP.open=null;viewDeep();}},
      el("b",{},x.v),
      el("span",{class:x.rt>=D.base?"g":"b"},` ${pc(x.rt)}`),
      el("span",{class:"dim"},r?` · ${r.roas.toFixed(2)}`:" · —")));
  });
  m.append(bar);

  const S=DP.v; if(!S){m.append(el("p",{class:"dim"},"셀 만한 소구가 없습니다."));return;}
  const A=D.vals.find(x=>x.ax==="소구"&&x.v===S);
  const ts=dpTs("소구",S);

  /* 머리 — 누적과 지금 */
  const r4=dpRecent(ts,4), r1=dpRecent(ts,1), r12=dpRecent(ts,12);
  m.append(el("div",{class:"dpsum"},
    el("div",{},el("p",{class:"dpk"},"누적 성공률"),
      el("p",{class:"dpv "+(A.lf>=0?"g":"b")},pc(A.rt)),
      el("p",{class:"dim sm2"},`${A.w}/${A.n}편 · 기저 ${pc(D.base)}보다 ${pp(A.lf)}`)),
    el("div",{},el("p",{class:"dpk"},"이번 주"),
      el("p",{class:"dpv "+(r1&&r1.sp>=DP_FLOOR?(r1.roas>=D.cut?"g":"b"):"dim")},
        !r1?"—":r1.sp<DP_FLOOR?"적음":r1.roas.toFixed(2)),
      el("p",{class:"dim sm2"},r1?`${man(r1.sp)} · ${r1.d}편`+(r1.sp<DP_FLOOR?` · ${man(DP_FLOOR)}이 안 돼 숫자가 튑니다`:""):"돈이 안 갔습니다")),
    el("div",{},el("p",{class:"dpk"},"최근 4주"),
      el("p",{class:"dpv "+(r4&&r4.roas>=D.cut?"g":"b")},r4?r4.roas.toFixed(2):"—"),
      el("p",{class:"dim sm2"},r4?`${man(r4.sp)} · ${r4.d}편`:"—")),
    el("div",{},el("p",{class:"dpk"},"최근 12주"),
      el("p",{class:"dpv "+(r12&&r12.roas>=D.cut?"g":"b")},r12?r12.roas.toFixed(2):"—"),
      el("p",{class:"dim sm2"},r12?`${man(r12.sp)} · ${r12.d}편`:"—"))));
  m.append(el("p",{class:"lysay"},dpSay(A, r4, r12)));
  /* 가설 셋의 결론 한 줄 — 「어디서 갈리나」가 하던 말을 여기로 가져온다 */
  const H=hyp3("소구",S);
  if(H) m.append(el("p",{class:"h3up"},
    el("b",{},"어디까지 정해서 써야 하나 — "),H.upto,
    el("button",{class:"lnk ic",style:"margin-left:8px",
      onclick:()=>lyGo("소구",S)},"가설 셋 보기 →")));

  /* ② 메인으로 열까 서브로 넣을까 */
  const F=D.vals.find(x=>x.ax==="첫 소구"&&x.v===S);
  if(F && F.n>=4){
    const d=F.rt-A.rt;
    m.append(el("div",{class:"note"+(d>=0.10?" ok":"")},
      el("b",{},"메인으로 열까 서브로 넣을까. "),
      `넣기만 하면 ${pc(A.rt)}(${A.w}/${A.n}편) · 첫 소구로 열면 ${pc(F.rt)}(${F.w}/${F.n}편) — `,
      el("b",{class:d>=0?"g":"b"},pp(d)),
      el("span",{},d>=0.10?" 메인으로 여세요."
        :d<=-0.10?" 서브로 끼워 넣으세요 — 열면 오히려 떨어집니다."
        :" 어느 쪽이든 비슷합니다.")));
  } else {
    m.append(el("div",{class:"note"},
      el("b",{},"메인으로 연 원고가 "),`${F?F.n:0}편뿐이라 메인·서브를 견줄 수 없습니다. `,
      "지금은 서브로만 쓰이고 있다는 뜻이기도 합니다."));
  }

  /* 그림 */
  const gseg=el("div",{class:"cseg"});
  [["주","주별 16주"],["일","일별 14일"]].forEach(([k,t])=>
    gseg.append(el("button",{class:"csb"+(DP.grain===k?" on":""),
      onclick:()=>{DP.grain=k;viewDeep();}},t)));
  const mseg=el("div",{class:"cseg"});
  [["roas","직접 ROAS"],["sp","지출"],["cpa","직접 CPA"],["od","주문"]].forEach(([k,t])=>
    mseg.append(el("button",{class:"csb"+(DP.met===k?" on":""),
      onclick:()=>{DP.met=k;viewDeep();}},t)));
  m.append(el("div",{class:"bar",style:"justify-content:space-between;margin-top:14px"},gseg,mseg));
  m.append(multiChart([{name:S, color:"#4f7fff", pts:dpSeries(ts,DP.grain)}], DP.met));

  /* 갈래마다 — 누적과 지금을 나란히 */
  m.append(el("h3",{},"그 안에서 무엇이 되고 있나"),
    el("p",{class:"dim sm2",style:"margin:-4px 0 6px"},
      "성공률은 판정이 닫힌 원고, ROAS는 최근 4주에 돈이 간 원고입니다. 편수가 다를 수 있습니다."));
  const brs=h3Branches("소구",S)||[];
  if(!brs.length) m.append(el("p",{class:"dim"},"이 소구 아래로 갈라 볼 것이 판정에 없습니다."));
  else {
    /* 갈래에 최근 돈이 얼마나 갔나 — 대부분 비어 있으면 그 사실부터 말한다.
       갈래는 판정이 닫힌(=오래된) 원고에만 붙어 있고, 지금 도는 소재는 아직
       판정 밖이라 「최근 4주」 칸이 비는 것이 정상이다. 빈 칸을 조용히 두면
       「요즘 안 된다」로 잘못 읽힌다. */
    const all=brs.flatMap(b=>b.vs);
    const live=all.filter(r=>dpRecent(r.ts,4));
    m.append(el("div",{class:"note"+(live.length?"":" wa")},
      el("b",{},`갈래 ${all.length}개 중 최근 4주에 돈이 간 것은 ${live.length}개. `),
      live.length
        ? `나머지는 그 값을 쓴 원고가 요즘 안 돌아서 「—」입니다 — 안 되는 것이 아니라 안 쓴 것입니다.`
        : `이 소구는 요즘 돈이 안 갑니다. 아래 성공률은 지난 기록입니다.`));
  }
  brs.forEach(b=>{
    m.append(el("p",{class:"bdsg"},el("b",{},b.name),
      el("span",{class:"dim"},` — ${b.vs.length}개`)));
    const tb=el("div",{class:"lytab"});
    tb.append(el("div",{class:"dpr lyhd"},
      el("span",{},"판정"),el("span",{},"어떻게 썼나"),

/* 그 값을 쓴 원고 — 판정 rows에서 */
function dpTs(ax,v){
  const j=(D.jcod||{});
  const out=[];
  for(const t in j){ if((j[t][ax]||[]).includes(v)) out.push(t); }
  return out;
}

/* 한 줄 해설 — 누적과 지금이 어긋나면 그것부터 말한다 */
function dpSay(A, r4, r12){
  const up = A.lf>=0.10, dn = A.lf<=-0.10;
  if(!r4) return `${eun(A.v)} 최근 4주에 돈이 안 갔습니다. 누적으로는 ${pc(A.rt)}(기저 ${pp(A.lf)})입니다.`;
  if(r4.sp < DP_FLOOR) return `${eun(A.v)} 최근 4주 지출이 ${man(r4.sp)}뿐이라 ROAS를 믿을 수 없습니다. 누적으로는 ${pc(A.rt)}(기저 ${pp(A.lf)})입니다.`;
  const good = r4.roas>=D.cut;
  const trend = r12 ? (r4.roas-r12.roas) : 0;
  const t2 = r12 ? (trend>=0.15?` 12주 평균 ${r12.roas.toFixed(2)}에서 올라왔습니다.`
                  : trend<=-0.15?` 12주 평균 ${r12.roas.toFixed(2)}에서 내려왔습니다.` : "") : "";
  if(up && good)  return `누적으로도 되고(${pc(A.rt)}, 기저 ${pp(A.lf)}) 지금도 돌고 있습니다(최근 4주 ROAS ${r4.roas.toFixed(2)}).${t2}`;
  if(up && !good) return `누적으로는 되는데(${pc(A.rt)}, 기저 ${pp(A.lf)}) 지금은 안 돌고 있습니다(최근 4주 ROAS ${r4.roas.toFixed(2)}, 컷 ${D.cut}).${t2} 아래 갈래에서 무엇이 죽었는지 보세요.`;
  if(dn && good)  return `누적으로는 기저 아래인데(${pc(A.rt)}, ${pp(A.lf)}) 지금은 돌고 있습니다(최근 4주 ROAS ${r4.roas.toFixed(2)}).${t2} 아래에서 무엇이 살렸는지 보세요.`;
  if(dn && !good) return `누적도 기저 아래고(${pc(A.rt)}, ${pp(A.lf)}) 지금도 안 돕니다(최근 4주 ROAS ${r4.roas.toFixed(2)}).${t2}`;
  return `누적은 기저와 비슷하고(${pc(A.rt)}, ${pp(A.lf)}) 최근 4주 ROAS는 ${r4.roas.toFixed(2)}입니다.${t2} 소구 이름만으로는 갈리지 않으니 아래 갈래를 보세요.`;
}
function viewHome(){

        el("span",{class:"dim",id:"liveNow"},""),
        el("button",{class:"btn",id:"refBtn",onclick:doRefresh},"새로고침"))));
  pollLive();

  /* ★ 자료가 어디까지 들어와 있나. 이게 안 보이면 「아직 안 잰 것」을 「성적이
     나쁜 것」으로 읽는다. 어제 태운 소재의 ROAS 0이 실은 카페24 내보내기가
     며칠 전에서 멈춰 있어서였다. 갱신이 조용히 실패한 것도 여기서 말한다. */
  (function(){
    const 말 = [];
    /* 메타 지출이 언제까지 들어왔나. 수집이 조용히 0건을 받아도 프로그램은
       「성공」으로 끝난다 — 그러면 어제 자료로 오늘을 보게 된다. */
    {
      const 끝 = new Date(D.asof+"T00:00:00");
      const 늦 = Math.floor((Date.now() - 끝.getTime())/86400000);
      if(늦 >= 2) 말.push({급: 늦>=3, 글:
        `메타 지출이 ${D.asof}까지만 들어와 있습니다 (${늦}일 전). `+
        `수집이 걸렸거나 PC가 꺼져 있었습니다. 아래는 그날까지의 숫자입니다.`});
    }
    if(D.csvuntil){
      const 끝 = new Date(D.csvuntil+"T00:00:00"),
             지금 = new Date(D.asof+"T00:00:00"),
             날 = Math.round((지금-끝)/86400000);
      if(날 >= 2) 말.push({급:false, 글: D.guess
        ? `소재별 매출은 ${D.csvuntil}까지가 「확정」이고, ${D.guess.from}~${D.guess.to}는 `+
          `카페24 API로 「유추」한 값입니다. API는 소재 이름(utm_term)을 9자에서 잘라 버려서, `+
          `광고 이름 앞머리 번호(utm_content)로 짚습니다 — 번호 하나에 광고가 여럿이면 그날 지출 비율로 나눠 붙입니다. `+
          `카페24 「광고 유입 상세 분석」을 새로 내보내 다운로드 폴더에 두면 확정으로 바뀝니다.`
        : `소재별 매출은 ${D.csvuntil}까지만 붙어 있습니다 (${날}일 비었음). `+
          `그 뒤에 태운 소재는 지출만 있고 ROAS가 0으로 보입니다 — 성적이 아니라 잴 자료가 없는 것입니다. `+
          `카페24 「광고 유입 상세 분석」을 새로 내보내 다운로드 폴더에 두면 다음 갱신에 붙습니다.`});
    }
    const R = D.run||{};

/* ── 가설 제안 ─────────────────────────────────────────
   전 지표 판정은 값이 319개다. 표로 다 펴면 사람이 못 고른다.
   그래서 걸러서 카드로 보이고, 고른 것을 담아 원고로 넘긴다. */
let PICK = [];
const IF = {grp:"", kind:"", tag:"", turn:"", q:"", min:4, sort:"rt", card:false};

/* ─── 가설 세 단 ───────────────────────────────────────────────────────────
   값 하나를 고르면 가설이 저절로 셋 선다. 통화품질이면 —
     가설1  통화품질 자체가 되는가            (그 값 대 기저)
     가설2  통화품질 안에서 갈래가 중요한가    (갈래끼리 벌어지는가)
     가설3  그 갈래 안에서 워딩이 중요한가     (갈래 안 워딩끼리 벌어지는가)
   셋은 서로 다른 말이고, 어디까지 성립하느냐가 곧 「원고를 쓸 때 어디까지 정해야
   하나」다. 1만 성립하면 값만 지키면 되고, 2까지면 갈래를 골라야 하고, 3까지면
   워딩을 지정해야 한다.

   판정을 다시 하지 않는다. 전지표 판정이 낸 값별 성적을 모아 벌어짐을 재는 것뿐이다.

   아래층을 찾는 법이 묶음마다 다르다. 같은 층인데 이름 짓는 방식만 다르다 —
     소구  「소구 = 통화품질」 → 축 「통화품질 · 마이크」          값이름 + ○○
     CTA  「CTA = 할인·혜택」 → 축 「CTA · 할인·혜택」            축이름 · 값이름
     훅    「훅 유형 = 피하고 싶은 결과」
            → 축 「훅 워딩」 안의 값 「피하고 싶은 결과 · 이러면 못 듣게 된다고 한다」
                                                                 값이름이 값 앞머리
   그래서 축 이름과 값 이름을 다 뒤진다. */

/* 받침이 있으면 은/을, 없으면 는/를. 「귀건강는」·「훅을(를)」이 나오면 안 된다.
   화면 여러 곳에서 쓰므로 여기 한 군데에 둔다. */
function jo(w, pair){
  const c=String(w||" ").slice(-1).charCodeAt(0);
  const has = c>=0xAC00 && c<=0xD7A3 ? (c-0xAC00)%28!==0 : /[0-9a-zA-Z]$/.test(String(w||""));
  return w + pair[has?0:1];
}
const eun = w => jo(w,["은","는"]), eul = w => jo(w,["을","를"]);

const H3_STEP = 0.15;      // 갈래·워딩이 이만큼 벌어져야 「중요하다」고 본다
const H3_LIFT = 0.15;      // 값 하나가 기저에서 이만큼 움직여야 「된다」고 본다
                           // 가설 제안 줄의 「추천/금지」와 같은 기준이어야 한다.
                           // 한 화면에 숫자가 두 벌이면 어느 쪽을 믿을지 알 수 없다.
const H3_MIN  = 3;         // 이 편수는 돼야 셈에 넣는다

const h3Row  = (ax,v) => D.vals.find(x=>x.ax===ax && x.v===v);
const h3Vals = ax => D.vals.filter(x=>x.ax===ax && x.n>=H3_MIN);

/* 데이터는 심어서 올 수도, 열 때 받아 올 수도 있다. 여기서 바로 읽으면
   받아 오는 판에서 아직 null이라 화면이 통째로 죽는다 — 부를 때 채운다. */
let H3_GRP = null;
function h3Grp(){
  if(!H3_GRP){ H3_GRP={}; (D.idea||[]).forEach(x=>{ if(x.grp) H3_GRP[x.ax]=x.grp; }); }
  return H3_GRP;
}
/* 값 이름이 묶음 이름과 같으면(「첫 소구 위치 = 훅」) 그 이름으로 시작하는 축을
   갈래로 삼으면 안 된다. 「훅 유형」·「훅 워딩」은 그 값의 아래층이 아니라 남이다. */
const h3GrpName = () => new Set(Object.values(h3Grp()));
const h3Pre = (ax,v) => [(h3GrpName().has(v)?null:v), ax+" · "+v,
                         (h3Grp()[ax]?h3Grp()[ax]+" · "+v:null)].filter(Boolean);

/* 그 값 아래에 달린 축 */
function h3Subs(ax, v){
  const pre=h3Pre(ax,v), hit=new Set();
  D.vals.forEach(x=>{ if(x.ax===ax)return;
    pre.forEach(p=>{ if(x.ax===p || x.ax.startsWith(p+" ") || x.ax.startsWith(p+"·")) hit.add(x.ax); });});
  return [...hit].sort();
}
function h3Short(sub, ax, v){
  for(const p of h3Pre(ax,v)) if(sub===p) return v;
  for(const p of h3Pre(ax,v)) if(sub.startsWith(p)) return sub.slice(p.length).replace(/^[ ·]+/,"")||sub;
  return sub;
}
/* 한 축을 (조건에 맞는 값으로) 쓴 원고를 판정 코딩에서 그러모아 성적을 낸다.
   값별 성적을 그냥 더하면 값을 둘 가진 원고가 두 번 세어진다. */
function h3Pool(ax, ok){
  const C=D.jcod||{}; let n=0,w=0;
  for(const t in C){ const vv=C[t][ax]; if(!vv||!DR[t]) continue;
    if(DR[t].st!=="성공" && DR[t].st!=="실패") continue;
    if(!vv.some(ok)) continue;
    n++; if(DR[t].st==="성공") w++; }
  return {n, w, rt:n?w/n:0};
}
const h3Spread = rs => rs.length<2 ? 0 :
  Math.max(...rs.map(x=>x.rt)) - Math.min(...rs.map(x=>x.rt));

/* 후킹 · 본문 · CTA 표 — 판정 문서가 원고를 이 셋으로 가른 것.
   세 곳 다 「상위 값 → 그 아래 워딩」 두 층이고, 문장 분류에서 나온 것이라
   축·값 표와 뿌리가 다르다. 이름으로 앞머리를 맞춰 짐작하던 것을 대신한다.
     후킹  훅 유형 = 피하고 싶은 결과   → 그 유형의 워딩
     본문  소구 = 가성비               → 문제 · 근거 · 방식 → 각각의 워딩
     CTA  CTA 갈래 = 할인·혜택        → 그 갈래의 워딩 */
const H3_TABORD = ["문제","근거","방식","워딩"];
let H3_PT=null;
function h3PT(){
  if(H3_PT) return H3_PT;
  H3_PT={by:{}, top:{}};
  (D.ptab||[]).forEach(r=>{
    if(r.g){ (H3_PT.by[r.g]=H3_PT.by[r.g]||{})[r.tab]=(H3_PT.by[r.g]||{})[r.tab]||[];
             H3_PT.by[r.g][r.tab].push(r); }
    else   { (H3_PT.top[r.part]=H3_PT.top[r.part]||[]).push(r); }
  });
  return H3_PT;
}
/* 그 값이 상위 값이면(소구 · 훅 유형 · CTA 갈래) 아래 표를 갈래로 돌려준다 */
function h3Stab(v){
  const by=h3PT().by[v]; if(!by) return null;
  const ord=t=>{const i=H3_TABORD.indexOf(t); return i<0?9:i;};
  return Object.keys(by).sort((a,b)=>ord(a)-ord(b)).map(t=>{
    const vs=by[t].filter(r=>r.n>=H3_MIN).map(r=>({
      ax:`${v} — ${t}`, v:r.v, disp:r.v, n:r.n, w:r.w, rt:r.rt, lo:r.lo, hi:r.hi,
      lf:r.lf, sp:r.sp, split:r.out!=="구분 안 됨", ev:r.ev, ts:r.ts}));
    const seen=new Set(); by[t].forEach(r=>(r.ts||[]).forEach(x=>seen.add(x)));
    let n=0,w=0; seen.forEach(x=>{ const d=DR[x]; if(!d)return;
      if(d.st!=="성공"&&d.st!=="실패")return; n++; if(d.st==="성공")w++; });
    return {a:`${v} — ${t}`, name:t, vs, n, w, rt:n?w/n:0};
  }).filter(b=>b.vs.length);
}

/* 그 값 아래 갈래를 다 모은다 — 축으로 달린 것과 값 앞머리로 달린 것 둘 다 */
function h3Branches(ax, v){
  const st=h3Stab(v);
  if(st && st.length) return st;          // 소구는 판정 문서가 가른 그대로 쓴다
  const out=[];
  h3Subs(ax,v).forEach(a=>{
    const vs=h3Vals(a).map(x=>({...x, disp:x.v}));
    if(vs.length) out.push({a, name:h3Short(a,ax,v), vs, ...h3Pool(a, ()=>true)});
  });
  const pre=v+" · ", by={};
  if(!h3GrpName().has(v)) D.vals.forEach(x=>{ if(x.ax===ax || !x.v.startsWith(pre) || x.n<H3_MIN) return;
    (by[x.ax]=by[x.ax]||[]).push({...x, disp:x.v.slice(pre.length)}); });
  Object.entries(by).forEach(([a,vs])=>
    out.push({a, name:a, vs, ...h3Pool(a, s=>s.startsWith(pre))}));
  return out.filter(b=>b.n>=H3_MIN).sort((x,y)=>y.rt-x.rt);
}

/* 값 하나에 대해 가설 셋을 세우고 각각 성립하는지 본다 */
function hyp3(ax, v){
  const R=h3Row(ax,v);
  if(!R) return null;
  const out={ax, v, row:R};

  /* 가설1 — 이 값 자체가 되는가 */
  out.h1={
    say:`「${v}」 자체가 된다`,
    num:`${R.w}/${R.n}편 ${pc(R.rt)} · 기저 ${pc(D.base)}보다 ${pp(R.lf)}`,
    ok: R.split && R.n>=5 && R.lf>=H3_LIFT,
    no: (R.w===0&&R.n>=5) || (R.split && R.n>=5 && R.lf<=-H3_LIFT),
    why: R.w===0&&R.n>=5 ? `${R.n}편을 썼는데 성공이 하나도 없습니다 — 빼야 합니다.`
      : R.lf>=H3_LIFT ? (R.n>=5 && R.split ? `값 하나만으로 기저를 넘습니다. 넣기만 해도 됩니다.`
                         : R.n<5 ? `기저를 넘지만 ${R.n}편뿐이라 아직 못박을 수 없습니다.`
                         : `기저를 넘지만 구간이 기저를 건넙니다 — 아직 못박을 수 없습니다.`)
      : R.lf<=-H3_LIFT ? `기저보다 아래입니다. 값 하나로는 쓸 이유가 없습니다.`
      : `기저와 비슷합니다(${pp(R.lf)}). 값 이름만으로는 갈리지 않습니다.`};

  /* 가설2 — 갈래가 중요한가. 아래층이 없으면 「이 칸을 뭘로 채우느냐」로 올라간다 */
  const brs=h3Branches(ax,v);
  if(brs.length){
    /* 값이 하나뿐인 축은 갈래가 아니다. 「가성비 · 3구간으로 가른다」 안에
       「싸구려와 사치품 사이라고 한다」 하나뿐이면 축 이름은 그 워딩을 다르게
       부른 것일 뿐이라, 갈래라고 부르면 없는 층이 있는 것처럼 보인다. */
    brs.forEach(b=>{ b.one=b.vs.length===1; b.br=b.one?b.vs[0].disp:b.name; });
    const sp=h3Spread(brs), many=brs.filter(b=>!b.one);
    out.h2={kind:"갈래", list:brs, spread:sp, many:many.length, one:brs.length-many.length,
      say:`「${v}」 안에서 어느 갈래로 미느냐가 중요하다`,
      num: brs.length<2 ? `아래가 갈래로 나뉘지 않고 바로 워딩입니다`
        : `${brs.length}개가 ${pc(brs[brs.length-1].rt)}~${pc(brs[0].rt)}로 ${pp(sp)} 벌어집니다`
          + (brs.length-many.length ? ` · 그중 ${brs.length-many.length}개는 값이 하나뿐이라 갈래가 아니라 워딩입니다` : ""),
      ok: brs.length>=2 && sp>=H3_STEP,
      why: brs.length<2 ? `이 값 아래는 갈래가 나뉘어 있지 않습니다. 고를 것은 갈래가 아니라 워딩이니 가설 3으로 바로 갑니다.`
        : !many.length ? `아래가 전부 값 하나짜리입니다 — 갈래가 아니라 워딩 ${brs.length}개를 늘어놓은 것입니다. 「${brs[0].br}」 ${pc(brs[0].rt)}부터 「${brs[brs.length-1].br}」 ${pc(brs[brs.length-1].rt)}까지 ${pp(sp)} 벌어지니, 고를 것은 갈래가 아니라 워딩입니다.`
        : sp>=H3_STEP ? `고르는 것만으로 ${pp(sp)}가 갈립니다 — 지금은 「${brs[0].br}」가 ${pc(brs[0].rt)}로 제일 낫고 「${brs[brs.length-1].br}」가 ${pc(brs[brs.length-1].rt)}로 제일 낮습니다.`
        : `서로 ${pp(sp)}밖에 차이가 없습니다. 어느 쪽으로 밀든 비슷하니 여기서 고민할 게 없습니다.`};
  } else {
    const sib=h3Vals(ax), sp=h3Spread(sib);
    out.h2={kind:"칸", list:sib.slice().sort((x,y)=>y.rt-x.rt), spread:sp,
      say:`「${ax}」라는 칸을 뭘로 채우느냐가 중요하다`,
      num: sib.length<2 ? `이 칸에 견줄 값이 없습니다`
        : `값 ${sib.length}개가 ${pc(Math.min(...sib.map(x=>x.rt)))}~${pc(Math.max(...sib.map(x=>x.rt)))}로 ${pp(sp)} 벌어집니다`,
      ok: sib.length>=2 && sp>=H3_STEP,
      why: sib.length<2 ? `견줄 값이 없습니다.`
        : sp>=H3_STEP ? `이 칸을 뭘로 채우느냐로 ${pp(sp)}가 갈립니다. 아무거나 쓰면 안 되는 칸입니다.`
        : `값끼리 ${pp(sp)}밖에 차이가 없습니다. 이 칸은 뭘 써도 비슷하니 신경 쓸 데가 아닙니다.`};
  }

  /* 가설3 — 갈래 안에서 워딩이 중요한가 */
  if(brs.length){
    const each=brs.filter(b=>b.vs.length>=2)
      .map(b=>({a:b.a, br:b.name, rs:b.vs.slice().sort((x,y)=>y.rt-x.rt), spread:h3Spread(b.vs)}))
      .sort((x,y)=>y.spread-x.spread);
    const hit=each.filter(e=>e.spread>=H3_STEP);
    out.h3={list:each, hit,
      say:`갈래를 정한 뒤에도 어떤 워딩을 쓰느냐가 중요하다`,
      num: each.length? `${each.length}개 중 ${hit.length}개에서 워딩이 ${(H3_STEP*100).toFixed(0)}%p 넘게 갈립니다` : `견줄 워딩이 없습니다`,
      ok: hit.length>0,
      why: !each.length ? `아래에 워딩이 둘 이상 달린 갈래가 없습니다.`
        : hit.length ? `워딩까지 지정해야 합니다. `+
            hit.slice(0,2).map(e=>`「${e.br}」 안에서 ${pc(e.rs[e.rs.length-1].rt)}~${pc(e.rs[0].rt)}(${pp(e.spread)})`).join(" · ")+`.`
        : `어느 갈래에서도 워딩끼리 ${(H3_STEP*100).toFixed(0)}%p 넘게 갈리지 않습니다. 갈래까지만 정하면 됩니다.`};
  } else {
    out.h3={list:[], hit:[], say:`그 아래로 더 내려갈 층이 있다`, num:`이 값 아래로는 갈래도 워딩도 없습니다`,
      ok:false, why:`판정에 「${v} · ○○」 같은 축이나 값이 없습니다. ${v}까지가 지금 갈 수 있는 끝입니다.`};
  }

  /* 어디까지 정해서 써야 하나.
     아래층이 없는 값에서 「이 칸이 중요한가」는 값이 아니라 축의 성질이다 —
     값마다 「갈래까지」로 세면 319개 중 181개가 거기 몰려 아무 말도 안 된다.
     아래층이 실제로 달린 값만 2·3단으로 내려간다. */
  if(out.h1.no){ out.depth=0; out.upto=`「${v}」는 빼는 것이 결론입니다`; }
  else if(brs.length){
    out.depth = out.h3.ok ? 3 : out.h2.ok ? 2 : 1;
    out.upto = out.depth===3 ? `워딩까지 정해야 합니다 — 갈래를 골라도 안에서 갈립니다`
             : out.depth===2 ? `갈래까지 정하면 됩니다 — 갈래 안에서는 워딩이 갈리지 않습니다`
             : `「${v}」까지만 정하면 됩니다 — 아래를 골라도 달라지지 않습니다`;
  } else {
    out.depth = out.h2.ok ? 1 : -1;
    out.upto = out.h2.ok ? `「${v}」까지 정하면 됩니다 — 이 칸은 뭘 쓰느냐가 갈립니다`
                         : `이 칸은 뭘 써도 비슷합니다 — 여기서 정할 게 없습니다`;
  }
  return out;
}

/* 가설 제안의 모든 줄에 돌린다 */
function hyp3All(){
  const seen=new Set(), out=[];
  D.idea.forEach(x=>{
    const k=x.ax+" "+x.v; if(seen.has(k))return; seen.add(k);
    const h=hyp3(x.ax,x.v); if(h){h.grp=x.grp; out.push(h);}
  });
  return out;
}
/* ─── 어디서 갈리나 ────────────────────────────────────────────────────────
   값 하나를 골라 가설 셋을 세우고, 어디까지 성립하는지 본다. 판정 표가 아니라
   가설을 세우는 자리다 — 세우고, 근거를 보고, 쓸 만한 것만 담는다.
   셈은 _hyp3.js가 한다. 여기는 보여주는 일만 한다. */
let LY = {ax:null, v:null, open:null};

function lyBar(rt, ref){
  return el("span",{class:"lyb"},
    el("i",{style:`width:${Math.max(2,Math.min(100,rt*100))}%;`+
      `background:${rt>=(ref==null?D.base:ref)?"var(--ok)":"var(--no)"}`}),
    el("u",{style:`left:${Math.min(99,D.base*100)}%`,title:`기저 ${pc(D.base)}`}));
}
const lyPick = (ax,v,x,neg) => {
  const on=PICK.some(p=>p.ax===ax&&p.v===v);
  return el("button",{class:"lnk ic",title:on?"담은 것 빼기":"가설로 담기",onclick:()=>{
    if(on)PICK=PICK.filter(p=>!(p.ax===ax&&p.v===v));
    else PICK.push({ax,v,rt:x.rt,n:x.n,lf:x.lf,ban:!!neg});
    viewLayer();}}, on?"담음":"담기");
};
function lyGo(ax,v){ LY.ax=ax; LY.v=v; LY.open=null; go("layer"); }

/* 가설 한 칸 */
function lyCard(no, h, body){
  const st = h.ok ? {t:"성립", c:"yes"} : h.no ? {t:"뒤집힘", c:"no"} : {t:"안 섬", c:"none"};
  const c=el("div",{class:"h3c"+(h.ok?" on":"")});
  c.append(el("div",{class:"h3h"},
    el("span",{class:"h3no"},"가설 "+no),
    el("b",{class:"h3s"},h.say),
    el("span",{class:"mk "+st.c},st.t)));
  c.append(el("p",{class:"h3n"},h.num));
  c.append(el("p",{class:"lysay"},h.why));
  if(body)c.append(body);
  return c;
}

function viewLayer(){
  const m=$("#main");m.innerHTML="";
  /* 목차에 없는 화면이다 — 가설 제안 줄이나 소구에서 들어온다. */
  m.append(el("div",{class:"bar",style:"margin:0 0 2px"},
    el("button",{class:"lnk",onclick:()=>go("idea")},"← 가설 제안으로"),
    el("button",{class:"lnk",onclick:()=>go("deep")},"소구로")));
  m.append(el("p",{class:"eyebrow"},"트렌드와 가설"),el("h2",{},"어디서 갈리나"),
    el("p",{class:"lede"},
      "값 하나를 고르면 가설이 셋 섭니다 — ① 이 값 자체가 되는가 ② 그 안에서 갈래가 중요한가 "+
      "③ 갈래를 정한 뒤에도 워딩이 중요한가. 어디까지 성립하느냐가 곧 「원고를 쓸 때 어디까지 정해야 하나」입니다."));

  /* 고르기 — 갈래가 달린 값을 먼저, 그다음 묶음별로 */
  const all=hyp3All();
  const deep=all.filter(h=>h.h2.kind==="갈래").sort((a,b)=>b.row.n-a.row.n);
  if(!LY.v){const d=deep[0]||all[0]; if(d){LY.ax=d.ax;LY.v=d.v;}}
  const bar=el("div",{class:"lypick"});
  deep.forEach(h=>bar.append(el("button",{class:"qb"+(LY.v===h.v&&LY.ax===h.ax?" on":""),
    onclick:()=>lyGo(h.ax,h.v)},
    el("b",{},h.v), el("span",{class:h.row.rt>=D.base?"g":"b"},` ${pc(h.row.rt)}`),
    el("span",{class:"dim"},` ${h.row.n}편`))));
  m.append(el("p",{class:"dim",style:"margin:8px 0 3px"},"갈래가 달린 값"),bar);

  const other=el("div",{class:"bar"});
  const gsel=el("select",{});
  gsel.append(el("option",{value:""},"다른 묶음에서 고르기"));
  [...new Set(all.map(h=>h.grp).filter(Boolean))].forEach(g=>gsel.append(el("option",{value:g},g)));
  const vsel=el("select",{style:"min-width:230px"});
  const fillv=()=>{vsel.innerHTML="";
    all.filter(h=>h.grp===gsel.value).sort((a,b)=>b.row.n-a.row.n)
      .forEach(h=>vsel.append(el("option",{value:h.ax+""+h.v},
        `${h.v} — ${h.ax} · ${h.row.w}/${h.row.n}편 ${pc(h.row.rt)}`)));};
  gsel.addEventListener("change",()=>{fillv(); if(vsel.value){const[a,v]=vsel.value.split("");lyGo(a,v);}});
  vsel.addEventListener("change",()=>{const[a,v]=vsel.value.split("");lyGo(a,v);});
  other.append(gsel,vsel);
  m.append(other);

  const H=hyp3(LY.ax,LY.v);
  if(!H){m.append(el("p",{class:"dim"},"고른 값의 판정이 없습니다."));return;}
  const R=H.row;

  m.append(el("div",{class:"lytop"},
    el("p",{class:"lybig"},el("b",{},H.v),
      el("span",{class:"dim"},` · ${H.ax}`),
      " — ", el("span",{class:R.lf>=0?"g":"b"},`${R.w}/${R.n}편 ${pc(R.rt)}`),
      el("span",{class:"dim"},` · 기저 ${pc(D.base)}보다 `),el("span",{class:R.lf>=0?"g":"b"},pp(R.lf)),
      lyPick(H.ax,H.v,R,R.lf<0)),
    el("p",{class:"h3up"},el("b",{},"어디까지 정해서 써야 하나 — "),H.upto)));

  /* 가설1 */
  m.append(lyCard(1,H.h1));

  /* 가설2 — 갈래(또는 칸)를 표로 */
  let b2=null;
  if(H.h2.list.length>=2){
    const tb=el("div",{class:"lytab"});
    tb.append(el("div",{class:"lyr2 lyhd"},
      el("span",{},H.h2.kind==="갈래"?"갈래":"이 칸의 값"),
      el("span",{},"성공률"),el("span",{},"성공/편수"),el("span",{},"기저 대비"),el("span",{},"")));
    H.h2.list.forEach(b=>{
      const nm=H.h2.kind==="갈래"?b.br:b.v;
      const one=H.h2.kind==="갈래"&&b.one;
      const lf=b.rt-D.base;
      tb.append(el("div",{class:"lyr2"},
        el("span",{class:"lyv",title:one?`${b.a} — 값이 이것 하나뿐입니다`:nm},
          nm, one?el("span",{class:"dim wone"}," · 워딩 하나"):null),
        lyBar(b.rt),
        el("span",{class:"lyn"},el("b",{},pc(b.rt)),el("span",{class:"dim"},` ${b.w}/${b.n}편`)),
        el("span",{class:"lyd "+(lf>=0?"g":"b")},pp(lf)),
        H.h2.kind!=="갈래" ? lyPick(H.ax,b.v,b,lf<0)
        : one ? lyPick(b.a,b.vs[0].v,b.vs[0],b.vs[0].lf<0)
        : el("button",{class:"lnk ic",onclick:()=>{LY.open=(LY.open===b.a?null:b.a);viewLayer();}},
            LY.open===b.a?"접기":"워딩")));
      if(H.h2.kind==="갈래" && !one && LY.open===b.a){

    H.h3.list.forEach(e=>{

    el("button",{class:"btn2",onclick:()=>{if(!NX.pick)nxRoll(false);go("next");}},"원고 짜러 가기 →")));
}
